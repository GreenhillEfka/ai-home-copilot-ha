version: '3.8'

services:
  # Redis - Message Broker
  redis:
    image: redis:7-alpine
    container_name: pilotsuite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PilotSuite Core
  pilotsuite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilotsuite-core
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PILOTSUITE_DATA_DIR=/data
      - PILOTSUITE_DEBUG=false
    volumes:
      - pilotsuite_data:/data
      - /config:/config
    ports:
      - "8080:8080"  # REST API
    networks:
      - pilotsuite

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilotsuite-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
      - pilotsuite
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PILOTSUITE_DATA_DIR=/data
    volumes:
      - pilotsuite_data:/data
      - /config:/config
    command: celery -A copilot_core.celery_app worker --loglevel info --concurrency 4
    networks:
      - pilotsuite

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilotsuite-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PILOTSUITE_DATA_DIR=/data
    volumes:
      - pilotsuite_data:/data
      - /config:/config
    command: celery -A copilot_core.celery_app beat --loglevel info
    networks:
      - pilotsuite

  # Flower (Celery Monitor)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilotsuite-flower
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PILOTSUITE_DATA_DIR=/data
    volumes:
      - pilotsuite_data:/data
    ports:
      - "5555:5555"
    command: celery -A copilot_core.celery_app flower --port=5555
    networks:
      - pilotsuite

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: pilotsuite-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - pilotsuite

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: pilotsuite-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - pilotsuite

volumes:
  redis_data:
  pilotsuite_data:
  prometheus_data:
  grafana_data:

networks:
  pilotsuite:
    driver: bridge
