- id: kaffeemaschine_kaffeemuehle_sync
  alias: "Kaffeemaschine & Kaffeemühle synchronisieren"
  description: "Schaltet die Kaffeemühle immer同步 mit der Kaffeemaschine ein/aus und sendet TTS-Nachrichten"
  trigger:
    - platform: state
      entity_id: switch.kaffeemaschine
      to:
        - "on"
        - "off"
  action:
    - service: switch.turn_{{ trigger.to_state.state }}
      target:
        entity_id: switch.kaffeemuhle
    - service: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.gangbereich
        message: >
          {% if trigger.to_state.state == 'on' %}
            Ich habe die Kaffeemaschine eingeschaltet. Der Kaffee kommt – halte dich bereit!
          {% else %}
            Die Kaffeemaschine ist aus – der Kaffee-Modus ist vorerst beendet.
          {% endif %}
