# Services for PilotSuite RAG Conversation

search_rag:
  name: RAG Search
  description: Suche in der RAG-API nach kontextuellen Informationen
  fields:
    query:
      name: Query
      description: Die Suchanfrage
      example: "Wie war der Energieverbrauch gestern?"
      required: true
      selector:
        text:
    use_web:
      name: Web-Suche
      description: Ob Web-Suche (SearXNG) genutzt werden soll
      example: false
      required: false
      default: false
      selector:
        boolean:

get_conversation_history:
  name: Get Conversation History
  description: Hole die History einer Konversation
  fields:
    conversation_id:
      name: Conversation ID
      description: Die ID der Konversation
      example: "default-conversation"
      required: true
      selector:
        text:

clear_conversation_history:
  name: Clear Conversation History
  description: Lösche die History einer Konversation
  fields:
    conversation_id:
      name: Conversation ID
      description: Die ID der Konversation
      example: "default-conversation"
      required: true
      selector:
        text:
