# Beispiel-Konfiguration für PilotSuite RAG Conversation
# Diese Datei zeigt verschiedene Konfigurationsoptionen

# ==============================================================================
# OPTION 1: YAML-Konfiguration (configuration.yaml)
# ==============================================================================

# conversation:
#   - platform: pilotSuite_rag_conversation
#     rag_api_url: http://localhost:8765
#     openai_api_key: !secret openai_api_key
#     model: gpt-4
#     use_web_search: false

# ==============================================================================
# OPTION 6: LLM Fallback Chain (Automatisches Provider-Failover)
# ==============================================================================
# Bei Error/Timeout wird automatisch der nächste Provider versucht.
# Konfiguration in configuration.yaml:

# pilotSuite_rag_conversation:
#   # Fallback-Kette aktivieren/deaktivieren
#   fallback_enabled: true
#   
#   # Reihenfolge der Provider (wird nacheinander versucht)
#   fallback_order:
#     - openai      # Primär: OpenAI GPT-4
#     - ollama      # Fallback 1: Lokales Ollama (qwen3.5)
#     - ollama_tiny # Fallback 2: Kleines Ollama-Modell (schneller)
#   
#   # OpenAI Konfiguration
#   provider: gpt-4           # OpenAI Model zu verwenden
#   openai_api_key: !secret openai_api_key
#   
#   # Ollama Konfiguration
#   ollama_url: http://localhost:11434
#   ollama_model: qwen3.5
#   ollama_tiny_model: qwen3.5:7b
#   
#   # Timeout für jeden Provider (Sekunden)
#   timeout_seconds: 30

# Logging-Beispiel (wenn Fallback erfolgreich war):
# [INFO] [FallbackChain] SUCCESS: Provider 'ollama' generated response (attempt 2/3)
# → OpenAI fiel aus, Ollama hat erfolgreich geantwortet

# Logging-Beispiel (wenn ALLE Provider fehlschlagen):
# [ERROR] [FallbackChain] ALL PROVIDERS FAILED: Tried 3 providers (OpenAI, Ollama, Ollama). Last error: ...
# → Exception wird geworfen, User sieht Fehlermeldung

