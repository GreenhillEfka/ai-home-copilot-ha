# PilotSuite – Service Definitions
# Auto-discovered by HA Developer Tools → Services

# ─── Installation Guide ──────────────────────────────────────────────────────

show_installation_guide:
  name: PilotSuite – Installationsanleitung anzeigen
  description: Zeigt die exakte Installations- und Startanleitung als persistente Benachrichtigung an.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional. Falls gesetzt, wird die Anleitung auf diese Instanz bezogen.
      selector:
        text:

# ─── Tag Registry ────────────────────────────────────────────────────────────

tag_registry_upsert_tag:
  name: Tag Registry – Upsert Tag
  description: Erstellt oder aktualisiert einen Tag im Tag-Registry.
  fields:
    tag_key:
      name: Tag Key
      description: Eindeutiger Schlüssel des Tags (z.B. "area:kitchen").
      required: true
      example: "area:kitchen"
      selector:
        text:
    title:
      name: Titel
      description: Anzeigename des Tags.
      example: "Küche"
      selector:
        text:
    icon:
      name: Icon
      description: MDI-Icon für den Tag (z.B. "mdi:silverware-fork-knife").
      example: "mdi:silverware-fork-knife"
      selector:
        icon:
    color:
      name: Farbe
      description: Farbe des Tags (z.B. "orange").
      example: "orange"
      selector:
        text:
    status:
      name: Status
      description: Aktueller Status des Tags.
      example: "active"
      selector:
        text:

tag_registry_set_assignment:
  name: Tag Registry – Set Assignment
  description: Weist einem Subject (Entity/Area) eine Liste von Tags zu.
  fields:
    subject:
      name: Subject
      description: Entity-ID oder Area-Name, dem Tags zugewiesen werden.
      required: true
      example: "light.wohnzimmer"
      selector:
        text:
    tag_keys:
      name: Tag Keys
      description: Liste der zuzuweisenden Tag-Keys.
      required: true
      example: '["area:living_room", "type:ambient"]'
      selector:
        object:

tag_registry_confirm:
  name: Tag Registry – Confirm Tag
  description: Bestätigt einen vorgeschlagenen Tag (markiert ihn als geprüft).
  fields:
    tag_key:
      name: Tag Key
      description: Schlüssel des zu bestätigenden Tags.
      required: true
      example: "area:kitchen"
      selector:
        text:

tag_registry_sync_labels_now:
  name: Tag Registry – Sync Labels Now
  description: Synchronisiert alle Tags sofort mit HA-Labels.

tag_registry_pull_from_core:
  name: Tag Registry – Pull from Core
  description: Zieht den aktuellen Tag-System-Snapshot vom Core Add-on.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz (optional).
      selector:
        text:

# ─── Media Context v2 ────────────────────────────────────────────────────────

media_context_v2_suggest_zone_mapping:
  name: Media Context v2 – Suggest Zone Mapping
  description: Schlägt automatische Zone-zu-Speaker-Zuordnungen vor.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

media_context_v2_apply_zone_suggestions:
  name: Media Context v2 – Apply Zone Suggestions
  description: Wendet vorgeschlagene Zone-Mappings an.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

media_context_v2_clear_overrides:
  name: Media Context v2 – Clear Overrides
  description: Löscht alle manuellen Zone-Overrides.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

# ─── Suggestion Panel Actions ────────────────────────────────────────────────

suggestion_accept:
  name: Suggestion Panel – Annehmen
  description: Akzeptiert einen offenen Vorschlag aus dem Suggestion Panel.
  fields:
    suggestion_id:
      name: Suggestion ID
      description: Eindeutige ID des Vorschlags.
      required: true
      selector:
        text:
    user:
      name: User
      description: Optionaler User, der die Aktion ausführt.
      selector:
        text:

suggestion_reject:
  name: Suggestion Panel – Ablehnen
  description: Lehnt einen offenen Vorschlag ab.
  fields:
    suggestion_id:
      name: Suggestion ID
      description: Eindeutige ID des Vorschlags.
      required: true
      selector:
        text:
    user:
      name: User
      description: Optionaler User, der die Aktion ausführt.
      selector:
        text:
    reason:
      name: Reason
      description: Optionaler Ablehnungsgrund.
      selector:
        text:

suggestion_snooze:
  name: Suggestion Panel – Zurückstellen
  description: Schiebt einen Vorschlag fuer eine bestimmte Anzahl Stunden auf.
  fields:
    suggestion_id:
      name: Suggestion ID
      description: Eindeutige ID des Vorschlags.
      required: true
      selector:
        text:
    hours:
      name: Hours
      description: "Dauer des Snooze in Stunden (Standard: 4)."
      default: 4
      selector:
        number:
          min: 1
          max: 72
          mode: box

# ─── N3 Event Forwarder ──────────────────────────────────────────────────────

forwarder_n3_start:
  name: N3 Event Forwarder – Start
  description: Startet den Event-Forwarder zum Core Add-on (Heartbeat + Batch-Events).
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

forwarder_n3_stop:
  name: N3 Event Forwarder – Stop
  description: Stoppt den Event-Forwarder.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

forwarder_n3_stats:
  name: N3 Event Forwarder – Stats
  description: Gibt aktuelle Forwarder-Statistiken als Event aus.
  fields:
    entry_id:
      name: Config Entry ID
      description: ID der Konfigurationsinstanz.
      required: true
      selector:
        text:

# ─── Ops Runbook ─────────────────────────────────────────────────────────────

ops_runbook_preflight_check:
  name: Ops Runbook – Preflight Check
  description: Führt einen Preflight-Check durch (Systemvoraussetzungen, 1–2 Min.).

ops_runbook_smoke_test:
  name: Ops Runbook – Smoke Test
  description: Führt einen Smoke-Test durch (Basis-Funktionalität verifizieren).

ops_runbook_execute_action:
  name: Ops Runbook – Execute Action
  description: Führt eine benannte Runbook-Aktion aus.
  fields:
    action:
      name: Aktion
      description: Name der auszuführenden Runbook-Aktion.
      required: true
      example: "restart_forwarder"
      selector:
        text:

ops_runbook_run_checklist:
  name: Ops Runbook – Run Checklist
  description: Führt eine benannte Checklist aus dem Ops-Runbook aus.
  fields:
    checklist:
      name: Checklist
      description: Name der auszuführenden Checklist.
      required: true
      example: "post_update"
      selector:
        text:

# ─── Dev Surface (Debug) ─────────────────────────────────────────────────────

enable_debug_for:
  name: Debug – Fuer Entity aktivieren
  description: Aktiviert erweiterte Debug-Logs fuer eine bestimmte Entity.
  fields:
    entity_id:
      name: Entity ID
      description: Entity, für die Debug aktiviert werden soll.
      required: true
      example: "light.wohnzimmer"
      selector:
        entity:

disable_debug:
  name: Debug – Deaktivieren
  description: Deaktiviert erweiterte Debug-Logs.

clear_error_digest:
  name: Debug – Error-Digest leeren
  description: Loescht den gesammelten Error-Digest (Fehleruebersicht zuruecksetzen).

ping:
  name: Debug – Ping
  description: Einfacher Health-Check / Lebenszeichen der Integration.

# ─── Candidate Poller (Core Bridge) ──────────────────────────────────────────

trigger_mining:
  name: Trigger Mining
  description: Startet einen On-Demand Mining-Lauf im Core Add-on und pollt neue Kandidaten.
  fields:
    min_confidence:
      name: Min. Konfidenz
      description: Minimale Konfidenz für Pattern-Erkennung (0.0–1.0).
      example: 0.6
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    min_support:
      name: Min. Support
      description: Minimaler Support-Wert (0.0–1.0).
      example: 0.1
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    min_lift:
      name: Min. Lift
      description: Minimaler Lift-Wert (>1.0 = stärker als Zufall).
      example: 1.2
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.1
          mode: slider

# ─── UniFi Network Module ────────────────────────────────────────────────────

unifi_run_diagnostics:
  name: UniFi – Diagnostik starten
  description: Fuehrt Netzwerk-Diagnostik ueber die UniFi-Integration aus.

unifi_get_report:
  name: UniFi – Report abrufen
  description: Ruft den letzten UniFi-Netzwerk-Report ab.

copilot_ha_unifi_run_diagnostics:
  name: UniFi – Diagnostik starten (Legacy Alias)
  description: Legacy-Alias fuer pilotsuite.unifi_run_diagnostics waehrend der Migration.

copilot_ha_unifi_get_report:
  name: UniFi – Report abrufen (Legacy Alias)
  description: Legacy-Alias fuer pilotsuite.unifi_get_report waehrend der Migration.

# ─── Habitus Miner (Local) ───────────────────────────────────────────────────

habitus_mine_rules:
  name: Habitus – Regeln erkennen
  description: Startet lokales Pattern-Mining auf gesammelten Events.
  fields:
    days_back:
      name: Tage zurück
      description: Anzahl Tage an Events, die analysiert werden sollen.
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box
    domains:
      name: Domains (Filter)
      description: Nur Events dieser Domains einbeziehen.
      example: '["light", "climate"]'
      selector:
        object:
    exclude_domains:
      name: Domains (Ausschluss)
      description: Events dieser Domains ausschließen.
      example: '["sensor"]'
      selector:
        object:
    min_confidence:
      name: Min. Konfidenz
      description: Minimale Konfidenz-Schwelle für erkannte Regeln.
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    min_lift:
      name: Min. Lift
      description: Minimaler Lift-Wert.
      default: 1.2
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.1
          mode: slider

habitus_get_rules:
  name: Habitus – Regeln abrufen
  description: Ruft die aktuell erkannten Habitus-Regeln ab.
  fields:
    limit:
      name: Limit
      description: Maximale Anzahl zurückgegebener Regeln.
      default: 20
      selector:
        number:
          min: 1
          max: 200
          mode: box
    domain_filter:
      name: Domain-Filter
      description: Nur Regeln für diese Domain anzeigen.
      example: "light"
      selector:
        text:
    min_score:
      name: Min. Score
      description: Minimaler Score-Wert.
      default: 0.0
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.1
          mode: slider

habitus_reset_cache:
  name: Habitus – Cache leeren
  description: Loescht den Mining-Cache (erzwingt Neuberechnung beim naechsten Lauf).

habitus_configure_mining:
  name: Habitus – Mining konfigurieren
  description: Konfiguriert Mining-Parameter zur Laufzeit.
  fields:
    auto_mining_enabled:
      name: Auto-Mining aktiviert
      description: Automatisches Mining an/aus.
      selector:
        boolean:
    buffer_max_size:
      name: Buffer Max Size
      description: Maximale Anzahl Events im Mining-Buffer.
      selector:
        number:
          min: 100
          max: 10000
          mode: box
    buffer_max_age_hours:
      name: Buffer Max Age (Stunden)
      description: Maximales Alter der Events im Buffer.
      selector:
        number:
          min: 1
          max: 168
          mode: box

# ─── Multi-User Preference Learning (MUPL) ────────────────────────────────────

mupl_learn_preference:
  name: MUPL – Praeferenz lernen
  description: Lernt eine Praeferenz fuer einen bestimmten User.
  fields:
    user_id:
      name: User ID
      description: User ID (person.entity_id).
      required: true
      example: "person.user_a"
      selector:
        text:
    preference_type:
      name: Preference Type
      description: Art der Präferenz (light_brightness, media_volume, temperature, mood_weights).
      required: true
      example: "light_brightness"
      selector:
        select:
          options:
            - "light_brightness"
            - "media_volume"
            - "temperature"
            - "mood_weights"
    value:
      name: Value
      description: Präferenz-Wert (0.0-1.0 für brightness/volume, Grad für temperature, oder dict für mood_weights).
      required: true
      example: 0.8
      selector:
        object:
    zone:
      name: Zone
      description: "Optional: Zone-spezifische Präferenz."
      example: "wohnzimmer"
      selector:
        text:

mupl_set_user_priority:
  name: MUPL – User-Prioritaet setzen
  description: Setzt die Prioritaet eines Users fuer Multi-User Konfliktaufloesung.
  fields:
    user_id:
      name: User ID
      description: User ID (person.entity_id).
      required: true
      example: "person.user_a"
      selector:
        text:
    priority:
      name: Priority
      description: Priorität (0.0-1.0, höher = wichtiger).
      required: true
      example: 0.8
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1
          mode: slider

mupl_delete_user_data:
  name: MUPL – Userdaten loeschen
  description: Loescht alle gespeicherten Daten eines Users (Privacy/GDPR).
  fields:
    user_id:
      name: User ID
      description: User ID (person.entity_id).
      required: true
      example: "person.user_a"
      selector:
        text:

mupl_export_user_data:
  name: MUPL – Userdaten exportieren
  description: Exportiert alle gespeicherten Daten eines Users (Privacy/GDPR).
  fields:
    user_id:
      name: User ID
      description: User ID (person.entity_id).
      required: true
      example: "person.user_a"
      selector:
        text:

mupl_detect_active_users:
  name: MUPL – Aktive User erkennen
  description: Erkennt aktuell anwesende User und gibt sie zurueck.

mupl_get_aggregated_mood:
  name: MUPL – Aggregierten Mood abrufen
  description: Aggregiert den Mood aller aktiven User.
  fields:
    user_ids:
      name: User IDs
      description: "Optional: Liste spezifischer User-IDs (leer = alle aktiven User)."
      example: '["person.user_a", "person.partner"]'
      selector:
        object:

# ─── Debug Mode (Legacy) ──────────────────────────────────────────────────────

set_debug:
  name: Debug – Modus setzen
  description: Aktiviert oder deaktiviert den Debug-Modus fuer erweiterte Logs.
  fields:
    enabled:
      name: Enabled
      description: Debug-Modus an/aus.
      required: true
      example: true
      selector:
        boolean:

# ─── Debug Mode ──────────────────────────────────────────────────────────────

enable_debug:
  name: Debug – Aktivieren
  description: Aktiviert den Debug-Modus fuer PilotSuite mit optionalem Log-Level.
  fields:
    log_level:
      name: Log-Level
      description: Log-Level fuer den Debug-Modus (DEBUG, INFO, WARNING, ERROR).
      required: false
      example: "DEBUG"
      selector:
        select:
          options:
            - "DEBUG"
            - "INFO"
            - "WARNING"
            - "ERROR"

toggle_debug:
  name: Debug – Umschalten
  description: Schaltet den Debug-Modus fuer PilotSuite ein/aus.

clear_debug_buffer:
  name: Debug – Buffer leeren
  description: Leert den Debug-Nachrichten-Buffer.


# ─── Predictive Automation ───────────────────────────────────────────────────

predictive_automation_suggest_automation:
  name: Predictive Automation – Automatisierung vorschlagen
  description: Schlaegt eine Automatisierung auf Basis von ML-Mustern vor.
  fields:
    pattern:
      name: Pattern
      description: Das zu automatisierende Muster (z.B. "light.kitchen:on → switch.coffee:on").
      required: true
      example: "light.kitchen:on → switch.coffee:on"
      selector:
        text:
    confidence:
      name: Konfidenz
      description: Minimale Konfidenz für Vorschlag (0.0–1.0).
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    zone:
      name: Zone
      description: "Optional: Zone-spezifische Automatisierung."
      example: "kitchen"
      selector:
        text:

# ─── Anomaly Alert ───────────────────────────────────────────────────────────

anomaly_alert_check_and_alert:
  name: Anomaly Alert – Pruefen und Alarmieren
  description: Prueft aktuelle Daten auf Anomalien und sendet Alarme.
  fields:
    device_id:
      name: Device ID
      description: Zu überwachendes Gerät.
      required: true
      example: "sensor.living_room_temperature"
      selector:
        text:
    threshold:
      name: Threshold
      description: Anomalie-Schwellwert (0.0–1.0).
      default: 0.7
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider

anomaly_alert_clear_history:
  name: Anomaly Alert – Verlauf loeschen
  description: Loescht die Anomalie-Verlaufsdaten.

# ─── Energy Insights ───────────────────────────────────────────────────────

energy_insights_get:
  name: Energy Insights – Insights abrufen
  description: Ruft aktuelle Energie-Insights und Empfehlungen ab.
  fields:
    device_id:
      name: Device ID
      description: "Optional: Gerät für detaillierte Insights."
      example: "light.living_room"
      selector:
        text:
    hours:
      name: Hours
      description: "Zeitraum in Stunden (Standard: 24)."
      default: 24
      selector:
        number:
          min: 1
          max: 720
          mode: box

# ─── Habit Learning v2 ─────────────────────────────────────────────────────

habit_learning_learn:
  name: Habit Learning – Muster lernen
  description: Lernt ein neues Muster durch Beobachtung.
  fields:
    device_id:
      name: Device ID
      description: Gerät, dessen Verhalten beobachtet wird.
      required: true
      example: "light.kitchen"
      selector:
        text:
    event_type:
      name: Event Type
      description: Typ des Events (on, off, state_change).
      required: true
      example: "on"
      selector:
        text:
    device_chain:
      name: Device Chain
      description: "Optional: Sequenz von Geräten für Sequenz-Learning."
      example: '["light.kitchen", "switch.coffee", "climate.living_room"]'
      selector:
        object:

habit_learning_predict:
  name: Habit Learning – Vorhersage
  description: Vorhersage eines zukuenftigen Events oder einer Sequenz.
  fields:
    device_id:
      name: Device ID
      description: Gerät für Vorhersage.
      required: true
      example: "light.kitchen"
      selector:
        text:
    event_type:
      name: Event Type
      description: Typ des Events (on, off, state_change).
      required: true
      example: "on"
      selector:
        text:
    start_device:
      name: Start Device
      description: "Optional: Startgerät für Sequenz-Vorhersage."
      example: "light.kitchen"
      selector:
        text:

# ─── HomeKit Bridge (per-zone) ──────────────────────────────────────────────

homekit_enable_zone:
  name: HomeKit – Zone aktivieren
  description: Aktiviert HomeKit fuer eine Habitus-Zone (exponiert Entities an Apple Home).
  fields:
    zone_id:
      name: Zone ID
      description: ID der Habitus-Zone.
      required: true
      example: "zone:wohnzimmer"
      selector:
        text:
    zone_name:
      name: Zone Name
      description: Anzeigename der Zone in Apple Home.
      example: "Wohnzimmer by Styx"
      selector:
        text:

homekit_disable_zone:
  name: HomeKit – Zone deaktivieren
  description: Deaktiviert HomeKit fuer eine Habitus-Zone.
  fields:
    zone_id:
      name: Zone ID
      description: ID der Habitus-Zone.
      required: true
      example: "zone:wohnzimmer"
      selector:
        text:

# ─── Voice Context ──────────────────────────────────────────────────────────

parse_command:
  name: Voice – Befehl parsen
  description: Parst einen Sprachbefehl in Intent, Entities und Confidence.
  fields:
    text:
      name: Text
      description: Der zu parsende Sprachbefehl.
      required: true
      example: "Licht im Wohnzimmer einschalten"
      selector:
        text:

speak:
  name: Voice – Sprechen
  description: Gibt Text via TTS auf einem Media-Player aus.
  fields:
    text:
      name: Text
      description: Der auszugebende Text.
      required: true
      example: "Guten Morgen!"
      selector:
        text:
    entity_id:
      name: Entity ID
      description: "Optional: Ziel-Media-Player Entity."
      selector:
        entity:
          domain: media_player
    language:
      name: Language
      description: "Sprache fuer TTS (default: de)."
      default: "de"
      selector:
        text:

execute_command:
  name: Voice – Befehl ausfuehren
  description: Parst und fuehrt einen Sprachbefehl aus (parse + execute).
  fields:
    text:
      name: Text
      description: Der auszufuehrende Sprachbefehl.
      required: true
      example: "Schalte das Licht aus"
      selector:
        text:

get_voice_state:
  name: Voice – Status abrufen
  description: Gibt den aktuellen Voice-Context-Status zurueck (letzter Befehl, TTS-Entity, Tone).

set_voice_tone:
  name: Voice – Sprachstil setzen
  description: Setzt den Sprachstil (formal, casual, friendly, professional).
  fields:
    tone:
      name: Tone
      description: Der gewuenschte Sprachstil.
      required: true
      default: "formal"
      selector:
        select:
          options:
            - "formal"
            - "casual"
            - "friendly"
            - "professional"

# ─── Musikwolke / Zone Media Control ──────────────────────────────────────

musikwolke_create:
  name: Musikwolke – Gruppe erstellen
  description: Erstellt eine Musikwolke-Gruppe ueber mehrere Zonen (synchronisierte Wiedergabe).
  fields:
    zone_ids:
      name: Zone IDs
      description: Liste der Zonen-IDs fuer die Gruppe.
      required: true
      example: '["wohnzimmer", "kueche", "schlafzimmer"]'
      selector:
        object:

musikwolke_dissolve:
  name: Musikwolke – Gruppe aufloesen
  description: Loest eine Musikwolke-Gruppe auf.
  fields:
    zone_ids:
      name: Zone IDs
      description: Liste der aufzuloesenden Zonen-IDs.
      required: true
      example: '["wohnzimmer", "kueche"]'
      selector:
        object:

musikwolke_play:
  name: Musikwolke – Zone abspielen
  description: Startet Wiedergabe in einer Zone.
  fields:
    zone_id:
      name: Zone ID
      description: ID der Zone.
      required: true
      example: "wohnzimmer"
      selector:
        text:
    volume_pct:
      name: Volume (%)
      description: "Optional: Lautstaerke in Prozent (0-100)."
      selector:
        number:
          min: 0
          max: 100
          mode: slider

musikwolke_pause:
  name: Musikwolke – Zone pausieren
  description: Pausiert Wiedergabe in einer Zone.
  fields:
    zone_id:
      name: Zone ID
      description: ID der Zone.
      required: true
      example: "wohnzimmer"
      selector:
        text:

musikwolke_volume:
  name: Musikwolke – Lautstaerke setzen
  description: Setzt die Lautstaerke fuer eine Zone.
  fields:
    zone_id:
      name: Zone ID
      description: ID der Zone.
      required: true
      example: "wohnzimmer"
      selector:
        text:
    volume_pct:
      name: Volume (%)
      description: Lautstaerke in Prozent (0-100).
      required: true
      example: 30
      selector:
        number:
          min: 0
