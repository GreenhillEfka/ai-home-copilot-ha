# ─── Entity-centric Zone Assignment ─────────────────────────────────────────

create_zone:
  name: Habitus-Zone erstellen
  description: Erstellt eine neue Habitus-Zone direkt aus echten HA-Areas und Entity-Auswahl. Ideal fuer Frontend-/Lovelace-Karten.
  fields:
    entry_id:
      name: Entry ID
      description: "Optional: konkrete PilotSuite Config Entry ID. Wenn leer, wird die erste PilotSuite-Instanz verwendet."
      example: "abcd1234efgh5678"
      selector:
        text:
    name:
      name: Zone Name
      description: Optionaler Anzeigename der Zone. Wenn leer, wird der Bereichsname verwendet.
      example: "Wohnzimmer"
      selector:
        text:
    area_ids:
      name: Area IDs
      description: Eine oder mehrere HA-Areas, aus denen die Zone gebaut wird.
      example: '["living_room"]'
      selector:
        text:
    motion_entity_id:
      name: Motion Entity
      description: Optionale Bewegungs-/Praesenz-Entity. Wenn leer, wird aus der Area vorgeschlagen.
      example: "binary_sensor.wohnzimmer_motion"
      selector:
        entity:
          domain:
            - binary_sensor
            - sensor
    light_entity_ids:
      name: Licht-Entities
      description: Optionale Licht-Entities. Wenn leer, werden passende Area-Lichter vorgeschlagen.
      example: '["light.wohnzimmer_decke", "light.wohnzimmer_stehlampe"]'
      selector:
        text:
    optional_entity_ids:
      name: Weitere Entities
      description: Optionale weitere Entities fuer die neue Zone.
      example: '["media_player.wohnzimmer_tv", "sensor.wohnzimmer_temperature"]'
      selector:
        text:

assign_entity_to_zone:
  name: Entity einer Zone zuordnen
  description: Weist eine Entity einer Habitus-Zone zu (entfernt sie vorher aus anderen Zonen).
  fields:
    entity_id:
      name: Entity ID
      description: Die zuzuordnende Entity.
      required: true
      example: "light.wohnzimmer"
      selector:
        entity:
    zone_id:
      name: Zone ID
      description: ID der Ziel-Zone (z.B. "zone:wohnzimmer").
      required: true
      example: "zone:wohnzimmer"
      selector:
        text:

remove_entity_from_zone:
  name: Entity aus Zone entfernen
  description: Entfernt eine Entity aus allen Habitus-Zonen.
  fields:
    entity_id:
      name: Entity ID
      description: Die zu entfernende Entity.
      required: true
      example: "light.wohnzimmer"
      selector:
        entity:

# ─── Entity-centric Tag Assignment ──────────────────────────────────────────

tag_entity:
  name: Entity taggen
  description: Weist einer Entity einen oder mehrere Tags zu.
  fields:
    entity_id:
      name: Entity ID
      description: Die zu taggende Entity.
      required: true
      example: "light.wohnzimmer"
      selector:
        entity:
    tag_ids:
      name: Tag IDs
      description: "Komma-getrennte Tag-IDs (z.B. \"licht,klima\")."
      required: true
      example: "licht,klima"
      selector:
        text:

untag_entity:
  name: Tag von Entity entfernen
  description: Entfernt Tags von einer Entity.
  fields:
    entity_id:
      name: Entity ID
      description: Die Entity, von der Tags entfernt werden sollen.
      required: true
      example: "light.wohnzimmer"
      selector:
        entity:
    tag_ids:
      name: Tag IDs
      description: "Komma-getrennte Tag-IDs (z.B. \"licht,klima\")."
      required: true
      example: "licht"
      selector:
        text:
