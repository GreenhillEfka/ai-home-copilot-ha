# AI Home Copilot - RAG Search Card Configuration
# Path: custom_components/copilot_ha/dashboard_cards/rag_search_card.yaml
# 
# This YAML provides configuration examples for the RAG Search Card
# Features: Search input with autocomplete, results with snippets, source documents, zone/category filters
# API: /api/v1/rag/search (hybrid search with BM25 + Semantic + RRF)

# =============================================================================
# EXAMPLE 1: Basic RAG Search Card
# =============================================================================
# Simple search without filters

views:
  - title: 🔍 Wissensdatenbank
    path: knowledge_base
    cards:
      - type: custom:ha-copilot-rag-search-card
        title: Suche
        placeholder: "Dokumentation, Runbooks, FAQs durchsuchen..."
        max_results: 10
        api_endpoint: /api/v1/rag/search


# =============================================================================
# EXAMPLE 2: RAG Search with Zone Filters
# =============================================================================
# Search card with zone-based filtering

views:
  - title: 🔍 Wissensdatenbank
    path: knowledge_base_zones
    cards:
      - type: custom:ha-copilot-rag-search-card
        title: Suche
        placeholder: "Suche in Dokumentation..."
        max_results: 15
        api_endpoint: /api/v1/rag/search
        show_filters: true
        zones:
          - Wohnzimmer
          - Schlafzimmer
          - Küche
          - Bad
          - Arbeitszimmer
        default_zone: ""


# =============================================================================
# EXAMPLE 3: RAG Search with Category Filters
# =============================================================================
# Search card with category filtering

views:
  - title: 🔍 Wissensdatenbank
    path: knowledge_base_categories
    cards:
      - type: custom:ha-copilot-rag-search-card
        title: Suche
        placeholder: "Suche in Dokumentation..."
        max_results: 10
        api_endpoint: /api/v1/rag/search
        show_filters: true
        categories:
          - documentation
          - runbook
          - faq
          - troubleshooting
          - automation
          - sensor
          - light
          - climate
        default_category: ""


# =============================================================================
# EXAMPLE 4: RAG Search with Zone AND Category Filters
# =============================================================================
# Full-featured search with both filter types

views:
  - title: 🔍 Wissensdatenbank
    path: knowledge_base_full
    cards:
      - type: custom:ha-copilot-rag-search-card
        title: Suche
        placeholder: "Suche in Dokumentation, Runbooks, FAQs..."
        max_results: 20
        api_endpoint: /api/v1/rag/search
        show_filters: true
        zones:
          - Wohnzimmer
          - Schlafzimmer
          - Küche
          - Bad
          - Arbeitszimmer
          - Flur
          - Garten
        categories:
          - documentation
          - runbook
          - faq
          - troubleshooting
          - automation
          - sensor
          - light
          - climate
          - energy
          - security
        default_zone: ""
        default_category: ""


# =============================================================================
# EXAMPLE 5: Complete Dashboard with RAG Search
# =============================================================================
# Full dashboard combining RAG Search with other cards

views:
  - title: 🏠 AI Home Copilot
    path: ai_home_dashboard
    cards:
      # RAG Search - Full Width
      - type: custom:ha-copilot-rag-search-card
        title: 🔍 Wissensdatenbank
        placeholder: "Dokumentation, Runbooks, FAQs, Automatisierungen durchsuchen..."
        max_results: 15
        api_endpoint: /api/v1/rag/search
        show_filters: true
        zones:
          - Wohnzimmer
          - Schlafzimmer
          - Küche
          - Bad
          - Arbeitszimmer
        categories:
          - documentation
          - runbook
          - faq
          - troubleshooting
          - automation

      # Two-column: Mood + System Status
      - type: grid
        columns: 2
        cards:
          - type: custom:ha-copilot-mood-card
            title: 😊 Stimmung
            entity: sensor.copilot_ha_mood
          - type: custom:ha-copilot-neurons-card
            title: 🧠 Neuronen
            entity: sensor.neuron_activity


# =============================================================================
# EXAMPLE 6: Embedded RAG Search (Compact)
# =============================================================================
# Compact version for embedding in other views

views:
  - title: 📖 Dokumentation
    path: documentation
    cards:
      - type: vertical-stack
        title: 📖 Dokumentation
        cards:
          # Compact Search
          - type: custom:ha-copilot-rag-search-card
            title: ""
            placeholder: "Schnellsuche..."
            max_results: 5
            api_endpoint: /api/v1/rag/search
            show_filters: false
          
          # Documentation List (placeholder)
          - type: markdown
            content: |
              ### 📚 Dokumentation
              
              - [Installationsanleitung](./docs/install)
              - [Konfiguration](./docs/config)
              - [API Referenz](./docs/api)
              - [Troubleshooting](./docs/troubleshoot)


# =============================================================================
# Card Configuration Reference
# =============================================================================
# All available configuration options:
#
# type: custom:ha-copilot-rag-search-card
#
# Basic Options:
#   title: string              # Card title (default: "Knowledge Search")
#   placeholder: string        # Input placeholder text
#   max_results: number        # Maximum results to display (default: 10)
#   api_endpoint: string       # API endpoint for search (default: /api/rag/search)
#
# Filter Options:
#   show_filters: boolean      # Show zone/category filters (default: true)
#   zones: string[]           # List of available zones
#   categories: string[]       # List of available categories
#   default_zone: string       # Pre-selected zone (optional)
#   default_category: string  # Pre-selected category (optional)
#
# Styling Options:
#   icon: string              # Icon for card header
#   theme: string             # Theme variant (default, compact, detailed)


# =============================================================================
# API Request/Response Format
# =============================================================================
# 
# Request (POST /api/v1/rag/search):
# {
#   "query": "search terms",
#   "top_k": 10,
#   "use_lexical": true,      # BM25 search
#   "use_semantic": true,     # Vector search
#   "include_text": true,
#   "include_metadata": true,
#   "zone": "Wohnzimmer",     # optional filter
#   "category": "automation",  # optional filter
#   "namespace": "default"    # optional namespace
# }
#
# Response:
# {
#   "results": [
#     {
#       "id": "doc_123",
#       "text": "Matched document text...",
#       "score": 0.85,
#       "rank": 1,
#       "metadata": {
#         "source": "documentation",
#         "zone": "Wohnzimmer",
#         "title": "Light Automation"
#       }
#     }
#   ],
#   "result_count": 10,
#   "took_ms": 45,
#   "mode": "hybrid_rrf"
# }
