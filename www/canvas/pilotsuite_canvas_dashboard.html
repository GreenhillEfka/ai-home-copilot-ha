<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PilotSuite Canvas Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* Canvas-Style Design System - Dark Mode */
        :root {
            --bg-primary: #0b0f14;
            --bg-secondary: #151a23;
            --bg-tertiary: #1a2030;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent-green: #4CAF50;
            --accent-orange: #FF5722;
            --accent-blue: #2196F3;
            --accent-purple: #9C27B0;
            --accent-cyan: #00BCD4;
            --border-color: #2d3748;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 24px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .dashboard-header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse-dot 2s infinite;
        }

        .status-dot.warning { background: var(--warning); }
        .status-dot.error { background: var(--error); }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        /* Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Section Card */
        .section-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Mood Gauges Grid */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .mood-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .mood-card h4 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .mood-gauge {
            position: relative;
            width: 120px;
            height: 60px;
            margin: 0 auto;
        }

        .mood-gauge canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .mood-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .mood-label {
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Neuron Graph */
        .neuron-container {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }

        .neuron-container svg {
            width: 100%;
            height: 100%;
        }

        .node {
            cursor: pointer;
        }

        .node circle {
            stroke-width: 2px;
        }

        .node text {
            font-size: 10px;
            fill: var(--text-primary);
            pointer-events: none;
        }

        .link {
            stroke-opacity: 0.6;
        }

        .node-info {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }

        .node-info.visible {
            display: block;
        }

        /* Zone Grid */
        .zone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .zone-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .zone-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .zone-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .zone-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .zone-status.ok { background: rgba(76,175,80,0.2); color: var(--success); }
        .zone-status.warning { background: rgba(255,152,0,0.2); color: var(--warning); }
        .zone-status.error { background: rgba(244,67,54,0.2); color: var(--error); }

        .zone-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Live Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent-green);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        /* Connection Status */
        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }

        .connection-status.connected { border-color: var(--success); }
        .connection-status.disconnected { border-color: var(--error); }

        /* Refresh Button */
        .btn-refresh {
            padding: 6px 12px;
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1>🧠 PilotSuite Canvas Dashboard</h1>
            <p>Real-time Neural System Visualization</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="system-status-dot"></div>
                    <span id="system-status-text">System Online</span>
                </div>
                <div class="status-item">
                    <span>🧠</span>
                    <span id="neuron-count">14 Neuronen</span>
                </div>
                <div class="status-item">
                    <span>⏱️</span>
                    <span id="last-update">--:--:--</span>
                </div>
            </div>
        </div>

        <!-- Main Grid: Mood + Neurons -->
        <div class="main-grid">
            <!-- Mood Gauges -->
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">😊 Mood System</div>
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        LIVE
                    </div>
                </div>
                <div class="mood-grid">
                    <div class="mood-card">
                        <h4>System</h4>
                        <div class="mood-gauge" id="systemMoodGauge"></div>
                        <div class="mood-label" id="systemMoodLabel">Stable</div>
                    </div>
                    <div class="mood-card">
                        <h4>User</h4>
                        <div class="mood-gauge" id="userMoodGauge"></div>
                        <div class="mood-label" id="userMoodLabel">Neutral</div>
                    </div>
                    <div class="mood-card">
                        <h4>Network</h4>
                        <div class="mood-gauge" id="networkMoodGauge"></div>
                        <div class="mood-label" id="networkMoodLabel">Good</div>
                    </div>
                </div>
            </div>

            <!-- Neuron Graph -->
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">🔮 Neural Network</div>
                    <button class="btn-refresh" onclick="refreshNeurons()">Refresh</button>
                </div>
                <div class="neuron-container" id="neuronGraph"></div>
                <div class="node-info" id="nodeInfo">
                    <strong id="selectedNeuron">-</strong>: <span id="neuronValue">-</span>
                </div>
            </div>
        </div>

        <!-- Zones Section -->
        <div class="section-card">
            <div class="section-header">
                <div class="section-title">🏠 Zone Status</div>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    LIVE
                </div>
            </div>
            <div class="zone-grid" id="zoneGrid">
                <!-- Zones populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Connection Status -->
    <div class="connection-status connected" id="connectionStatus">
        <div class="status-dot"></div>
        <span id="connectionText">Connected</span>
    </div>

    <script>
        /**
         * PilotSuite Canvas Dashboard
         * Full integration with Home Assistant WebSocket for live updates
         */

        'use strict';

        // ============================================
        // Configuration
        // ============================================
        const CONFIG = {
            haUrl: window.location.origin.includes('nabu.casa') 
                ? window.location.origin 
                : 'https://js71lc792ufv9o245ysczlg2wj1mmgfu.ui.nabu.casa',
            updateInterval: 5000,
            demoMode: !window.location.origin.includes('nabu.casa') && window.location.protocol === 'file:'
        };

        // ============================================
        // State
        // ============================================
        let state = {
            connected: false,
            neurons: [],
            mood: { system: 75, user: 60, network: 85 },
            zones: []
        };

        // ============================================
        // Mood Gauge Component
        // ============================================
        class MoodGauge {
            constructor(containerId, options = {}) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;

                this.value = options.value || 50;
                this.colors = [
                    { pos: 0, color: '#F44336' },
                    { pos: 50, color: '#FF9800' },
                    { pos: 100, color: '#4CAF50' }
                ];

                this._init();
            }

            _init() {
                this.width = 120;
                this.height = 60;
                this.radius = 50;

                this.canvas = document.createElement('canvas');
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.ctx = this.canvas.getContext('2d');

                this.valueEl = document.createElement('div');
                this.valueEl.className = 'mood-value';
                this.valueEl.textContent = this.value;

                this.container.appendChild(this.canvas);
                this.container.appendChild(this.valueEl);

                this._draw();
            }

            setValue(value) {
                this.value = Math.max(0, Math.min(100, value));
                this.valueEl.textContent = Math.round(this.value);
                this._draw();
            }

            _getColor(value) {
                for (let i = this.colors.length - 1; i >= 0; i--) {
                    if (value >= this.colors[i].pos) {
                        return this.colors[i].color;
                    }
                }
                return this.colors[0].color;
            }

            _draw() {
                const cx = this.width / 2;
                const cy = this.height;
                const startAngle = Math.PI;
                const endAngle = 0;

                this.ctx.clearRect(0, 0, this.width, this.height);

                // Background arc
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, this.radius, startAngle, endAngle);
                this.ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                this.ctx.lineWidth = 10;
                this.ctx.lineCap = 'round';
                this.ctx.stroke();

                // Value arc
                const progress = this.value / 100;
                const currentAngle = startAngle + (endAngle - startAngle) * progress;

                this.ctx.beginPath();
                this.ctx.arc(cx, cy, this.radius, startAngle, currentAngle);
                this.ctx.strokeStyle = this._getColor(this.value);
                this.ctx.lineWidth = 10;
                this.ctx.lineCap = 'round';
                this.ctx.shadowColor = this._getColor(this.value);
                this.ctx.shadowBlur = 8;
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;
            }
        }

        // ============================================
        // Neuron Graph (D3.js Force-Directed)
        // ============================================
        class NeuronGraph {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;

                this.width = this.container.clientWidth;
                this.height = this.container.clientHeight;

                this.nodes = [];
                this.links = [];

                this._init();
            }

            _init() {
                this.svg = d3.select(this.container)
                    .append('svg')
                    .attr('width', this.width)
                    .attr('height', this.height);

                this._createSampleData();
                this._createSimulation();
                this._render();
            }

            _createSampleData() {
                // 14 Neurons: 3 Input, 8 Hidden, 3 Output
                this.nodes = [
                    // Input neurons
                    { id: 'context', type: 'input', name: 'Context', active: true, value: 0.85 },
                    { id: 'presence', type: 'input', name: 'Presence', active: true, value: 0.92 },
                    { id: 'time', type: 'input', name: 'Time', active: true, value: 0.78 },
                    
                    // Hidden neurons
                    { id: 'energy', type: 'hidden', name: 'Energy', active: true, value: 0.65 },
                    { id: 'climate', type: 'hidden', name: 'Climate', active: true, value: 0.88 },
                    { id: 'media', type: 'hidden', name: 'Media', active: false, value: 0.22 },
                    { id: 'light', type: 'hidden', name: 'Light', active: true, value: 0.73 },
                    { id: 'security', type: 'hidden', name: 'Security', active: true, value: 0.95 },
                    { id: 'weather', type: 'hidden', name: 'Weather', active: true, value: 0.60 },
                    { id: 'activity', type: 'hidden', name: 'Activity', active: true, value: 0.81 },
                    { id: 'schedule', type: 'hidden', name: 'Schedule', active: false, value: 0.35 },
                    
                    // Output neurons
                    { id: 'mood', type: 'output', name: 'Mood', active: true, value: 0.72 },
                    { id: 'action', type: 'output', name: 'Action', active: true, value: 0.55 },
                    { id: 'suggestion', type: 'output', name: 'Suggest', active: true, value: 0.68 }
                ];

                // Connections
                this.links = [
                    // Input to Hidden
                    { source: 'context', target: 'energy', weight: 0.8 },
                    { source: 'context', target: 'climate', weight: 0.6 },
                    { source: 'presence', target: 'light', weight: 0.9 },
                    { source: 'presence', target: 'security', weight: 0.7 },
                    { source: 'time', target: 'schedule', weight: 0.85 },
                    { source: 'time', target: 'activity', weight: 0.75 },
                    
                    // Hidden interconnections
                    { source: 'energy', target: 'climate', weight: 0.5 },
                    { source: 'activity', target: 'media', weight: 0.6 },
                    { source: 'weather', target: 'climate', weight: 0.7 },
                    { source: 'light', target: 'energy', weight: 0.4 },
                    
                    // Hidden to Output
                    { source: 'energy', target: 'mood', weight: 0.8 },
                    { source: 'climate', target: 'mood', weight: 0.6 },
                    { source: 'activity', target: 'mood', weight: 0.7 },
                    { source: 'light', target: 'action', weight: 0.9 },
                    { source: 'security', target: 'action', weight: 0.85 },
                    { source: 'schedule', target: 'suggestion', weight: 0.75 },
                    { source: 'media', target: 'suggestion', weight: 0.65 },
                    { source: 'weather', target: 'suggestion', weight: 0.55 },
                    
                    // Additional connections
                    { source: 'mood', target: 'suggestion', weight: 0.7 },
                    { source: 'action', target: 'mood', weight: 0.5 }
                ];
            }

            _createSimulation() {
                this.simulation = d3.forceSimulation(this.nodes)
                    .force('link', d3.forceLink(this.links).id(d => d.id).distance(60))
                    .force('charge', d3.forceManyBody().strength(-150))
                    .force('center', d3.forceCenter(this.width / 2, this.height / 2))
                    .force('collision', d3.forceCollide().radius(25));
            }

            _render() {
                const typeColors = {
                    input: '#4CAF50',
                    hidden: '#2196F3',
                    output: '#9C27B0'
                };

                // Links
                this.linkElements = this.svg.append('g')
                    .selectAll('line')
                    .data(this.links)
                    .enter()
                    .append('line')
                    .attr('class', 'link')
                    .attr('stroke', d => `rgba(255,255,255,${d.weight * 0.5})`)
                    .attr('stroke-width', d => d.weight * 2);

                // Nodes
                this.nodeElements = this.svg.append('g')
                    .selectAll('g')
                    .data(this.nodes)
                    .enter()
                    .append('g')
                    .attr('class', 'node')
                    .call(this._drag())
                    .on('click', (e, d) => this._showNodeInfo(d));

                // Node circles
                this.nodeElements.append('circle')
                    .attr('r', d => 12 + d.value * 8)
                    .attr('fill', d => typeColors[d.type])
                    .attr('stroke', d => d.active ? '#fff' : '#666')
                    .attr('stroke-width', 2)
                    .attr('opacity', d => d.active ? 1 : 0.4);

                // Node labels
                this.nodeElements.append('text')
                    .attr('dy', 25)
                    .attr('text-anchor', 'middle')
                    .text(d => d.name);

                // Update positions on tick
                this.simulation.on('tick', () => {
                    this.linkElements
                        .attr('x1', d => d.source.x)
                        .attr('y1', d => d.source.y)
                        .attr('x2', d => d.target.x)
                        .attr('y2', d => d.target.y);

                    this.nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
                });
            }

            _drag() {
                return d3.drag()
                    .on('start', (e, d) => {
                        if (!e.active) this.simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (e, d) => {
                        d.fx = e.x;
                        d.fy = e.y;
                    })
                    .on('end', (e, d) => {
                        if (!e.active) this.simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    });
            }

            _showNodeInfo(node) {
                const infoEl = document.getElementById('nodeInfo');
                document.getElementById('selectedNeuron').textContent = node.name;
                document.getElementById('neuronValue').textContent = 
                    `Active: ${node.active ? 'Yes' : 'No'}, Value: ${(node.value * 100).toFixed(0)}%`;
                infoEl.classList.add('visible');
            }

            updateData(newNodes) {
                // Update node values
                newNodes.forEach(newNode => {
                    const node = this.nodes.find(n => n.id === newNode.id);
                    if (node) {
                        node.value = newNode.value;
                        node.active = newNode.active;
                    }
                });

                // Re-render circles
                this.nodeElements.selectAll('circle')
                    .attr('r', d => 12 + d.value * 8)
                    .attr('opacity', d => d.active ? 1 : 0.4);
            }
        }

        // ============================================
        // Zone Cards
        // ============================================
        function renderZones() {
            const zones = [
                { name: 'Zone A', status: 'ok', temp: 22, humidity: 45, devices: '8/8', energy: 'Low' },
                { name: 'Zone B', status: 'warning', temp: 25, humidity: 60, devices: '7/8', energy: 'Medium' },
                { name: 'Zone C', status: 'error', temp: 18, humidity: 30, devices: '5/8', energy: 'High' }
            ];

            const grid = document.getElementById('zoneGrid');
            grid.innerHTML = zones.map(zone => `
                <div class="zone-card">
                    <div class="zone-header">
                        <div class="zone-name">${zone.name}</div>
                        <div class="zone-status ${zone.status}">${zone.status.toUpperCase()}</div>
                    </div>
                    <div class="zone-metrics">
                        <div class="metric">
                            <span class="metric-label">Temp</span>
                            <span class="metric-value">${zone.temp}°C</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Humidity</span>
                            <span class="metric-value">${zone.humidity}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Devices</span>
                            <span class="metric-value">${zone.devices}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Energy</span>
                            <span class="metric-value">${zone.energy}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // Home Assistant Integration
        // ============================================
        let ws = null;
        let moodGauges = {};
        let neuronGraph = null;

        function connectHA() {
            if (CONFIG.demoMode) {
                console.log('[Dashboard] Demo mode - skipping HA connection');
                initDemo();
                return;
            }

            try {
                ws = new WebSocket(`${CONFIG.haUrl.replace('https', 'wss')}/api/websocket`);
                
                ws.onopen = () => {
                    console.log('[Dashboard] WebSocket connected');
                    updateConnectionStatus(true);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleHAMessage(data);
                };

                ws.onerror = (error) => {
                    console.error('[Dashboard] WebSocket error:', error);
                    updateConnectionStatus(false);
                };

                ws.onclose = () => {
                    console.log('[Dashboard] WebSocket closed');
                    updateConnectionStatus(false);
                    setTimeout(connectHA, 5000);
                };
            } catch (error) {
                console.error('[Dashboard] Connection failed:', error);
                initDemo();
            }
        }

        function handleHAMessage(data) {
            if (data.type === 'auth_required') {
                // Send auth (token would need to be injected)
                ws.send(JSON.stringify({ type: 'auth', access_token: 'DEMO_TOKEN' }));
            } else if (data.type === 'auth_ok') {
                console.log('[Dashboard] Authenticated');
                subscribeToEntities();
            } else if (data.type === 'event') {
                handleHAEvent(data);
            }
        }

        function subscribeToEntities() {
            // Subscribe to mood sensor
            ws.send(JSON.stringify({
                id: 1,
                type: 'subscribe_events',
                event_type: 'state_changed',
                entity_id: 'sensor.ai_home_copilot_mood'
            }));

            // Subscribe to neuron dashboard
            ws.send(JSON.stringify({
                id: 2,
                type: 'subscribe_events',
                event_type: 'state_changed',
                entity_id: 'sensor.ai_home_copilot_neuron_dashboard'
            }));
        }

        function handleHAEvent(data) {
            if (data.event?.data?.entity_id) {
                const entityId = data.event.data.entity_id;
                const newState = data.event.data.new_state;

                if (entityId.includes('mood')) {
                    updateMoodFromHA(newState);
                } else if (entityId.includes('neuron')) {
                    updateNeuronsFromHA(newState);
                }
            }
        }

        function updateMoodFromHA(stateData) {
            if (!stateData?.attributes) return;
            
            const mood = stateData.attributes;
            if (mood.system_mood !== undefined) {
                moodGauges.system?.setValue(mood.system_mood * 100);
            }
            if (mood.user_mood !== undefined) {
                moodGauges.user?.setValue(mood.user_mood * 100);
            }
            if (mood.network_mood !== undefined) {
                moodGauges.network?.setValue(mood.network_mood * 100);
            }
        }

        function updateNeuronsFromHA(stateData) {
            if (!stateData?.attributes || !neuronGraph) return;
            
            const attrs = stateData.attributes;
            const neurons = [];
            
            // Parse neurons from HA attributes
            ['context_neurons', 'state_neurons', 'mood_neurons'].forEach(type => {
                if (attrs[type]) {
                    Object.entries(attrs[type]).forEach(([name, data]) => {
                        neurons.push({
                            id: name,
                            value: data.value || 0.5,
                            active: data.active !== false
                        });
                    });
                }
            });

            neuronGraph.updateData(neurons);
        }

        function updateConnectionStatus(connected) {
            state.connected = connected;
            const el = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');
            
            if (connected) {
                el.classList.remove('disconnected');
                el.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                el.classList.remove('connected');
                el.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        // ============================================
        // Demo Mode
        // ============================================
        function initDemo() {
            console.log('[Dashboard] Initializing demo mode');
            updateConnectionStatus(false);
            document.getElementById('connectionText').textContent = 'Demo Mode';

            // Start demo updates
            setInterval(updateDemoData, 3000);
        }

        function updateDemoData() {
            // Random mood updates
            moodGauges.system?.setValue(50 + Math.random() * 50);
            moodGauges.user?.setValue(40 + Math.random() * 60);
            moodGauges.network?.setValue(60 + Math.random() * 40);

            // Update timestamp
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('de-DE');

            // Update neuron values
            if (neuronGraph) {
                const updates = neuronGraph.nodes.map(n => ({
                    id: n.id,
                    value: Math.random(),
                    active: Math.random() > 0.2
                }));
                neuronGraph.updateData(updates);
            }
        }

        // ============================================
        // Refresh Functions
        // ============================================
        function refreshNeurons() {
            if (neuronGraph) {
                neuronGraph.simulation.alpha(0.5).restart();
            }
        }

        // ============================================
        // Initialize Dashboard
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Dashboard] Initializing...');

            // Initialize Mood Gauges
            moodGauges.system = new MoodGauge('systemMoodGauge', { value: 75 });
            moodGauges.user = new MoodGauge('userMoodGauge', { value: 60 });
            moodGauges.network = new MoodGauge('networkMoodGauge', { value: 85 });

            // Initialize Neuron Graph
            neuronGraph = new NeuronGraph('neuronGraph');

            // Render Zones
            renderZones();

            // Try HA connection
            connectHA();

            // Update timestamp
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('de-DE');

            console.log('[Dashboard] Initialized');
        });

        // Expose for debugging
        window.dashboard = {
            state,
            moodGauges,
            neuronGraph,
            refreshNeurons
        };
    </script>
</body>
</html>
