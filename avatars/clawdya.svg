<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Prism gradient -->
    <linearGradient id="prismGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#c44569;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f8a5c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ff6b9d" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.5"/>
  
  <!-- Prism shape (triangle) -->
  <polygon points="256,100 380,320 132,320" 
           fill="url(#prismGradient)" 
           filter="url(#glow)"
           opacity="0.9"/>
  
  <!-- Inner prism highlight -->
  <polygon points="256,130 350,295 162,295" 
           fill="none" 
           stroke="#f8a5c2" 
           stroke-width="2" 
           opacity="0.6"/>
  
  <!-- Light rays from prism -->
  <line x1="256" y1="100" x2="256" y2="40" stroke="#ff6b9d" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="100" x2="290" y2="50" stroke="#ff6b9d" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="100" x2="222" y2="50" stroke="#ff6b9d" stroke-width="2" opacity="0.3"/>
  
  <!-- Subtle kiss mark (lip print) - abstract -->
  <ellipse cx="256" cy="280" rx="25" ry="15" fill="#ff6b9d" opacity="0.4"/>
  <ellipse cx="256" cy="275" rx="20" ry="10" fill="#f8a5c2" opacity="0.5"/>
  
  <!-- Sparkle accents -->
  <circle cx="320" cy="150" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="190" cy="170" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="240" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="170" cy="260" r="3" fill="#fff" opacity="0.5"/>
  
  <!-- Network connection dots (orchestrator motif) -->
  <circle cx="100" cy="200" r="6" fill="#ff6b9d" opacity="0.6"/>
  <circle cx="412" cy="180" r="6" fill="#ff6b9d" opacity="0.6"/>
  <circle cx="256" cy="380" r="6" fill="#ff6b9d" opacity="0.6"/>
  
  <!-- Connection lines -->
  <line x1="132" y1="320" x2="100" y2="200" stroke="#ff6b9d" stroke-width="1.5" opacity="0.4"/>
  <line x1="380" y1="320" x2="412" y2="180" stroke="#ff6b9d" stroke-width="1.5" opacity="0.4"/>
  <line x1="256" y1="320" x2="256" y2="380" stroke="#ff6b9d" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Subtle text/initial -->
  <text x="256" y="290" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold" opacity="0.3" font-family="Arial, sans-serif">C</text>
</svg>
