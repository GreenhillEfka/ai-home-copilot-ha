---
# External Secret Store Configuration
# Defines how ESO connects to secret backends
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secret-store
    app.kubernetes.io/component: vault
spec:
  provider:
    vault:
      server: "https://vault.pilot-suite.internal:8200"
      path: "secret"
      version: "v2"
      namespace: "pilot-suite"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "pilot-suite-secrets"
          serviceAccountRef:
            name: external-secrets-sa
---
# Service Account for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: service-account
---
# RBAC for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-pilot-suite
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["external-secrets.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-pilot-suite-binding
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-pilot-suite
subjects:
- kind: ServiceAccount
  name: external-secrets-sa
  namespace: pilot-suite
