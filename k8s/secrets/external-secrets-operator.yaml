---
# External Secrets Operator Installation
# Source: https://external-secrets.io/latest/
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/version: v0.9.13
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "0.9.13"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      interval: 12h
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    serviceMonitor:
      enabled: true
      interval: "30s"
    prometheus:
      enabled: true
      service:
        port: 8080
    webhook:
      serviceMonitor:
        enabled: true
        interval: "30s"
    certController:
      serviceMonitor:
        enabled: true
        interval: "30s"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
