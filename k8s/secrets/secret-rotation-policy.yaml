---
# Secret Rotation Policy Configuration
# Defines automated rotation schedules and policies for different secret types
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: rotation-policy-config
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/component: policy
spec:
  refreshInterval: 1h
  secretStoreRefs:
  - name: vault-backend
    kind: SecretStore
  selector:
    secret:
      name: rotation-policy-config
  template:
    engineVersion: v2
    data:
      rotation-policy.json: |
        {
          "policies": {
            "database": {
              "rotationInterval": "30d",
              "notificationDays": 7,
              "autoRotate": true,
              "requireApproval": false,
              "backupBeforeRotate": true
            },
            "api-keys": {
              "rotationInterval": "90d",
              "notificationDays": 14,
              "autoRotate": true,
              "requireApproval": true,
              "backupBeforeRotate": true
            },
            "oauth": {
              "rotationInterval": "180d",
              "notificationDays": 30,
              "autoRotate": false,
              "requireApproval": true,
              "backupBeforeRotate": true
            },
            "tls": {
              "rotationInterval": "365d",
              "notificationDays": 30,
              "autoRotate": true,
              "requireApproval": false,
              "backupBeforeRotate": true
            },
            "service-accounts": {
              "rotationInterval": "60d",
              "notificationDays": 14,
              "autoRotate": true,
              "requireApproval": false,
              "backupBeforeRotate": true
            }
          }
        }
---
# CronJob for Secret Rotation Checks
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation-checker
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/component: scheduler
  annotations:
    description: "Checks secrets approaching rotation deadline"
spec:
  schedule: "0 8 * * *"  # Daily at 08:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: secret-rotation-checker
        spec:
          serviceAccountName: external-secrets-sa
          restartPolicy: OnFailure
          containers:
          - name: rotation-checker
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "=== Secret Rotation Check $(date) ==="
              echo "Checking secrets approaching rotation deadline..."
              
              # Get all ExternalSecrets with rotation annotations
              kubectl get externalsecrets -n pilot-suite -o json | \
                jq -r '.items[] | select(.metadata.annotations["secrets-management.pilot-suite.io/rotation-policy"]) | 
                "\(.metadata.name): \(.metadata.annotations["secrets-management.pilot-suite.io/rotation-policy"])"'
              
              # Check last sync time
              kubectl get externalsecrets -n pilot-suite -o json | \
                jq -r '.items[] | "\(.metadata.name): last-sync=\(.status.refreshTime)"'
              
              echo "Rotation check complete"
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
---
# AlertRule for Prometheus: Secret Rotation Warnings
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-rotation-alerts
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/component: monitoring
    prometheus: pilot-suite
spec:
  groups:
  - name: secrets-management.rules
    rules:
    - alert: SecretApproachingRotation
      expr: |
        (time() - external_secrets_secret_last_sync_timestamp_seconds) > 
        (external_secrets_secret_rotation_interval_seconds * 0.8)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Secret {{ $labels.secret }} approaching rotation deadline"
        description: "Secret {{ $labels.secret }} in namespace {{ $labels.namespace }} has not been rotated in {{ $value | humanizeDuration }} and is approaching the rotation threshold."
    - alert: SecretRotationFailed
      expr: |
        external_secrets_secret_sync_calls_total{status="error"} > 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "Secret rotation failed for {{ $labels.secret }}"
        description: "Secret {{ $labels.secret }} in namespace {{ $labels.namespace }} has failed to rotate. Check External Secrets Operator logs."
    - alert: ExternalSecretsOperatorDown
      expr: |
        up{job="external-secrets"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "External Secrets Operator is down"
        description: "External Secrets Operator has been down for more than 5 minutes. Secret rotation and synchronization is halted."
---
# ConfigMap with rotation scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-rotation-scripts
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/component: scripts
data:
  rotate-database-secrets.sh: |
    #!/bin/sh
    # Database secret rotation script
    set -e
    
    NAMESPACE="${NAMESPACE:-pilot-suite}"
    SECRET_NAME="${SECRET_NAME:-db-credentials}"
    
    echo "Rotating database credentials..."
    
    # Trigger rotation via Vault API (requires Vault token)
    if [ -n "$VAULT_TOKEN" ]; then
      curl -s --header "X-Vault-Token: $VAULT_TOKEN" \
        --request POST \
        "$VAULT_ADDR/v1/database/rotate-root/pilot-suite"
      
      echo "Database credentials rotated successfully"
    else
      echo "ERROR: VAULT_TOKEN not set"
      exit 1
    fi
    
    # Force refresh ExternalSecret
    kubectl patch externalsecret "$SECRET_NAME" -n "$NAMESPACE" \
      -p '{"metadata":{"annotations":{"external-secrets.io/force-refresh":"'"$(date +%s)"'"}}}'
    
    echo "ExternalSecret refresh triggered"
  
  rotate-api-keys.sh: |
    #!/bin/sh
    # API key rotation script with approval workflow
    set -e
    
    NAMESPACE="${NAMESPACE:-pilot-suite}"
    SERVICE="${SERVICE:-unknown}"
    
    echo "API Key rotation initiated for service: $SERVICE"
    echo "Timestamp: $(date -Iseconds)"
    
    # Send notification to approval channel
    if [ -n "$TELEGRAM_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d text="🔐 API Key Rotation Request
        
    Service: $SERVICE
    Time: $(date -Iseconds)
    
    Reply with /approve to proceed or /cancel to abort."
    fi
    
    echo "Approval notification sent. Waiting for confirmation..."
  
  backup-secret.sh: |
    #!/bin/sh
    # Backup secret before rotation
    set -e
    
    NAMESPACE="${1:-pilot-suite}"
    SECRET_NAME="${2:-unknown}"
    BACKUP_DIR="/tmp/secret-backups"
    
    mkdir -p "$BACKUP_DIR"
    
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    BACKUP_FILE="${BACKUP_DIR}/${SECRET_NAME}-${TIMESTAMP}.yaml"
    
    echo "Backing up secret: $SECRET_NAME from namespace: $NAMESPACE"
    
    kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o yaml > "$BACKUP_FILE"
    
    # Encrypt backup (optional, requires age or sops)
    if command -v age >/dev/null 2>&1; then
      age -e -o "${BACKUP_FILE}.age" -r "$AGE_PUBLIC_KEY" "$BACKUP_FILE"
      rm "$BACKUP_FILE"
      echo "Backup encrypted: ${BACKUP_FILE}.age"
    else
      echo "Backup saved: $BACKUP_FILE (unencrypted)"
    fi
    
    # Keep only last 5 backups
    ls -t "${BACKUP_DIR}/${SECRET_NAME}"-*.yaml* 2>/dev/null | tail -n +6 | xargs -r rm
    
    echo "Backup complete"
