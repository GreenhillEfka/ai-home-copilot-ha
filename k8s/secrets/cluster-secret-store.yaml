---
# ClusterSecretStore - for cluster-wide secret access
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: pilot-suite-cluster-store
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: vault
spec:
  provider:
    vault:
      server: "https://vault.pilot-suite.internal:8200"
      path: "secret"
      version: "v2"
      namespace: "pilot-suite"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "pilot-suite-cluster-secrets"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: pilot-suite
---
# AWS Secrets Manager Store (optional fallback)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: pilot-suite
---
# Azure Key Vault Store (optional fallback)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: azure
spec:
  provider:
    azurekv:
      vaultUrl: "https://pilotsuite-kv.vault.azure.net/"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets-sa
        namespace: pilot-suite
