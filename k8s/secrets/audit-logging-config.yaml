---
# Audit Logging Configuration for Secrets Management
# Comprehensive logging for all secret operations
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-audit-config
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: logging
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    # Log all secret access at RequestResponse level
    - level: RequestResponse
      resources:
      - group: ""
        resources: ["secrets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    
    # Log ExternalSecret operations
    - level: RequestResponse
      resources:
      - group: "external-secrets.io"
        resources: ["externalsecrets", "secretstores", "clustersecretstores"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    
    # Log service account token requests
    - level: RequestResponse
      resources:
      - group: ""
        resources: ["serviceaccounts/token"]
    
    # Metadata-only logging for read-only operations by system components
    - level: Metadata
      resources:
      - group: ""
        resources: ["secrets"]
      verbs: ["get", "list", "watch"]
      users: ["system:serviceaccount:pilot-suite:external-secrets-sa"]
    
    # Don't log health checks
    - level: None
      verbs: ["get"]
      resources:
      - group: ""
        resources: ["secrets"]
      resourceNames: ["external-secrets-webhook-ca"]
---
# Audit Log Storage Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-log-storage
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: storage
data:
  storage-config.yaml: |
    # Audit log storage backend configuration
    backend:
      type: elasticsearch
      elasticsearch:
        hosts:
        - "https://elasticsearch.pilot-suite.internal:9200"
        index: "pilot-suite-secrets-audit"
        username: "audit-writer"
        passwordRef:
          name: elasticsearch-audit-credentials
          key: password
    
    retention:
      # Keep audit logs for 365 days
      days: 365
      # Compress logs older than 7 days
      compressAfterDays: 7
      # Move to cold storage after 30 days
      coldStorageAfterDays: 30
    
    alerting:
      # Alert on sensitive operations
      sensitiveOperations:
      - "delete"
      - "update"
      - "patch"
      channels:
      - type: telegram
        ref:
          name: audit-alert-channel
          key: chat-id
---
# Fluentd/Fluentbit configuration for audit log forwarding
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-log-forwarder
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: forwarding
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
    
    [INPUT]
        Name              tail
        Path              /var/log/kubernetes/audit/*.log
        Parser            json
        Tag               kubernetes.audit
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Directive 5
    
    [FILTER]
        Name                kubernetes
        Match               kubernetes.audit
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kubernetes.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
    
    [FILTER]
        Name          modify
        Match         kubernetes.audit
        Add           cluster pilot-suite
        Add           component secrets-audit
    
    [OUTPUT]
        Name            es
        Match           kubernetes.audit
        Host            elasticsearch.pilot-suite.internal
        Port            9200
        Index           pilot-suite-secrets-audit
        Type            _doc
        Logstash_Format On
        Logstash_Prefix pilot-suite-secrets-audit
        Retry_Limit     5
        Buffer_Size     1m
        Flush_Mode      smart
        Trace_Output    Off
        Trace_Error     On
---
# Dashboard for Secret Audit Visualization (Grafana)
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-audit-dashboard
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: visualization
    grafana_dashboard: "1"
data:
  secrets-audit-dashboard.json: |
    {
      "dashboard": {
        "title": "Secrets Management Audit",
        "tags": ["pilot-suite", "secrets", "audit"],
        "timezone": "Europe/Berlin",
        "panels": [
          {
            "title": "Secret Operations Over Time",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "rate(kubernetes_audit_event_total{resource=\"secrets\"}[5m])",
                "legendFormat": "{{ verb }}"
              }
            ]
          },
          {
            "title": "Secret Access by User/Service",
            "type": "piechart",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "sum by (user) (rate(kubernetes_audit_event_total{resource=\"secrets\"}[1h]))",
                "legendFormat": "{{ user }}"
              }
            ]
          },
          {
            "title": "ExternalSecret Sync Status",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "external_secrets_secret_sync_calls_total{status=\"success\"}",
                "legendFormat": "Success"
              },
              {
                "expr": "external_secrets_secret_sync_calls_total{status=\"error\"}",
                "legendFormat": "Errors"
              }
            ]
          },
          {
            "title": "Secrets Approaching Rotation",
            "type": "table",
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 8},
            "targets": [
              {
                "expr": "(time() - external_secrets_secret_last_sync_timestamp_seconds) / 86400",
                "legendFormat": "{{ secret }} - {{ age_days }} days"
              }
            ],
            "thresholds": [
              {"value": 25, "color": "yellow"},
              {"value": 28, "color": "red"}
            ]
          },
          {
            "title": "Recent Secret Operations Log",
            "type": "logs",
            "gridPos": {"h": 12, "w": 24, "x": 0, "y": 16},
            "targets": [
              {
                "query": "resource:secrets",
                "refId": "A"
              }
            ]
          }
        ],
        "time": {"from": "now-24h", "to": "now"},
        "refresh": "1m"
      }
    }
---
# ServiceMonitor for External Secrets Operator metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets-monitor
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: monitoring
    release: pilot-suite
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  namespaceSelector:
    matchNames:
    - external-secrets
    - pilot-suite
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
---
# RBAC for Audit Log Access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-audit-reader
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["external-secrets.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["secrets-audit-config", "audit-log-storage"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-audit-reader-binding
  labels:
    app.kubernetes.io/name: secrets-audit
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-audit-reader
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: monitoring
- kind: ServiceAccount
  name: security-team
  namespace: pilot-suite
