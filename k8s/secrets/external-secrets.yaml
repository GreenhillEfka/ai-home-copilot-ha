---
# ExternalSecret: Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: external-secret
    app.kubernetes.io/component: database
  annotations:
    secrets-management.pilot-suite.io/rotation-policy: "30d"
    secrets-management.pilot-suite.io/audit-level: "full"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets
  data:
  - secretKey: username
    remoteRef:
      key: pilot-suite/database
      property: username
  - secretKey: password
    remoteRef:
      key: pilot-suite/database
      property: password
  - secretKey: host
    remoteRef:
      key: pilot-suite/database
      property: host
  - secretKey: port
    remoteRef:
      key: pilot-suite/database
      property: port
---
# ExternalSecret: API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: external-secret
    app.kubernetes.io/component: api
  annotations:
    secrets-management.pilot-suite.io/rotation-policy: "90d"
    secrets-management.pilot-suite.io/audit-level: "full"
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
  - secretKey: telegram-bot-token
    remoteRef:
      key: pilot-suite/api/telegram
      property: bot-token
  - secretKey: openai-api-key
    remoteRef:
      key: pilot-suite/api/openai
      property: api-key
  - secretKey: anthropic-api-key
    remoteRef:
      key: pilot-suite/api/anthropic
      property: api-key
---
# ExternalSecret: TLS Certificates
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tls-certificates
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: external-secret
    app.kubernetes.io/component: tls
  annotations:
    secrets-management.pilot-suite.io/rotation-policy: "365d"
    secrets-management.pilot-suite.io/audit-level: "minimal"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: tls-certificates
    type: kubernetes.io/tls
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: tls.crt
    remoteRef:
      key: pilot-suite/tls/pilotsuite-internal
      property: certificate
  - secretKey: tls.key
    remoteRef:
      key: pilot-suite/tls/pilotsuite-internal
      property: private-key
---
# ExternalSecret: OAuth Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth-credentials
  namespace: pilot-suite
  labels:
    app.kubernetes.io/name: external-secret
    app.kubernetes.io/component: oauth
  annotations:
    secrets-management.pilot-suite.io/rotation-policy: "180d"
    secrets-management.pilot-suite.io/audit-level: "full"
spec:
  refreshInterval: 4h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: oauth-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
  - secretKey: google-client-id
    remoteRef:
      key: pilot-suite/oauth/google
      property: client-id
  - secretKey: google-client-secret
    remoteRef:
      key: pilot-suite/oauth/google
      property: client-secret
  - secretKey: github-client-id
    remoteRef:
      key: pilot-suite/oauth/github
      property: client-id
  - secretKey: github-client-secret
    remoteRef:
      key: pilot-suite/oauth/github
      property: client-secret
