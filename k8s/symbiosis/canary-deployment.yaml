apiVersion: apps/v1
kind: Deployment
metadata:
  name: symbiosis-canary
  labels:
    app: symbiosis
    track: canary
    version: v2-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: symbiosis
      track: canary
  template:
    metadata:
      labels:
        app: symbiosis
        track: canary
        version: v2-canary
    spec:
      containers:
      - name: symbiosis
        image: symbiosis:v2-canary
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8080
          name: metrics
        envFrom:
        - configMapRef:
            name: symbiosis-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
