apiVersion: autoscaling.k8s.io/v1
kind: ClusterPodAutoscaler
metadata:
  name: symbiosis-cluster-autoscaler
  labels:
    app: symbiosis
    component: cluster-autoscaler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: symbiosis
  scalingStrategy: "cluster-autoscaler"
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: "400m"
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: "384Mi"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
  # Integration with cluster-autoscaler
  clusterAutoscaler:
    enabled: true
    configMapRef:
      name: cluster-autoscaler-config
    # Priority for Symbiosis pods during node provisioning
    priorityClassName: "symbiosis-critical"
    # Ensure pods are scheduled on nodes with adequate resources
    resourceRequestGuarantee: true
