apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: symbiosis-vpa
  labels:
    app: symbiosis
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: symbiosis
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
    - containerName: symbiosis
      minAllowed:
        cpu: "50m"
        memory: "64Mi"
      maxAllowed:
        cpu: "1000m"
        memory: "1Gi"
      controlledResources: ["cpu", "memory"]
      controlledValues: "RequestsAndLimits"
