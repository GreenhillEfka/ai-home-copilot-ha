# Canary Ingress für Traffic Splitting (A/B Testing, Gradual Rollout)
# Annotation: nginx.ingress.kubernetes.io/canary: "true"
# Annotation: nginx.ingress.kubernetes.io/canary-weight: "20" (20% Traffic)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: symbiosis-canary
  labels:
    app: symbiosis
    track: canary
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary-Test"
    nginx.ingress.kubernetes.io/canary-by-header-value: "true"
    nginx.ingress.kubernetes.io/canary-by-cookie: "canary_test"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    nginx.ingress.kubernetes.io/session-cookie-name: "SYMBIOSIS_SESSION"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/affinity: "cookie"
spec:
  rules:
  - host: symbiosis.pilotsuite.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: symbiosis-canary
            port:
              number: 80
  tls:
  - hosts:
    - symbiosis.pilotsuite.local
    secretName: symbiosis-tls-secret
