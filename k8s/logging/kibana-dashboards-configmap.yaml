  setup-script.sh: |
    #!/bin/bash
    # Kibana Dashboard Setup Script for PilotSuite
    # Run this after Kibana is ready to import dashboards
    
    KIBANA_URL="http://kibana.logging.svc.cluster.local:5601"
    ELASTICSEARCH_URL="http://elasticsearch.logging.svc.cluster.local:9200"
    
    echo "Waiting for Elasticsearch to be ready..."
    until curl -s "${ELASTICSEARCH_URL}/_cluster/health" | grep -q '"status":"green"\|"status":"yellow"'; do
      echo "Elasticsearch is not ready yet..."
      sleep 5
    done
    echo "Elasticsearch is ready!"
    
    echo "Creating ILM policy..."
    curl -X PUT "${ELASTICSEARCH_URL}/_ilm/policy/kubernetes-logs-policy" \
      -H 'Content-Type: application/json' \
      -d @/usr/share/kibana/config/index-templates/ilm-policy.json
    
    echo "Creating index templates..."
    curl -X PUT "${ELASTICSEARCH_URL}/_index_template/kubernetes-logs-template" \
      -H 'Content-Type: application/json' \
      -d @/usr/share/kibana/config/index-templates/kubernetes-logs-template.json
    
    curl -X PUT "${ELASTICSEARCH_URL}/_index_template/system-logs-template" \
      -H 'Content-Type: application/json' \
      -d @/usr/share/kibana/config/index-templates/system-logs-template.json
    
    echo "Waiting for Kibana to be ready..."
    until curl -s "${KIBANA_URL}/api/status" | grep -q '"overall":{"state":"green"}'; do
      echo "Kibana is not ready yet..."
      sleep 5
    done
    echo "Kibana is ready!"
    
    echo "Importing dashboards..."
    for file in /usr/share/kibana/config/dashboards/*.ndjson; do
      echo "Importing $(basename $file)..."
      curl -X POST "${KIBANA_URL}/api/saved_objects/_import" \
        -H 'kbn-xsrf: true' \
        --form file=@"$file"
    done
    
    echo "Dashboard setup complete!"
    echo "Access Kibana at: ${KIBANA_URL}"
