<!-- Chat Widget Template - Embedded Chat with WebSocket -->
<div class="widget chat-widget" id="widget-chat">
    <div class="widget-header">
        <h3>💬 Chat</h3>
        <div class="widget-controls">
            <span class="connection-status" id="chat-connection-status">
                <span class="status-dot offline"></span>
            </span>
            <button class="btn-icon" id="btn-clear-chat" title="Clear Chat">🗑️</button>
        </div>
    </div>
    
    <div class="widget-content">
        <!-- Messages Container -->
        <div id="chat-messages" class="chat-messages">
            <div class="chat-welcome">
                <p>👋 Welcome! Start a conversation with the RAG API.</p>
                <p class="chat-hint">Type your message below and press Enter to send.</p>
            </div>
        </div>
        
        <!-- Quick Reply Suggestions -->
        <div id="quick-replies" class="quick-replies hidden">
            <button class="quick-reply-btn" data-msg="Status?">Status?</button>
            <button class="quick-reply-btn" data-msg="Welche Zonen sind aktiv?">Welche Zonen?</button>
            <button class="quick-reply-btn" data-msg="Energieverbrauch">Energie</button>
        </div>
        
        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
        
        <!-- Input Area -->
        <div class="chat-input-area">
            <textarea 
                id="chat-input" 
                class="chat-input" 
                placeholder="Type your message..."
                rows="2"
                maxlength="2000"
            ></textarea>
            <button id="btn-send" class="btn-send" title="Send Message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        
        <!-- Status Bar -->
        <div class="chat-status-bar">
            <span id="rag-api-status" class="api-status">
                <span class="status-indicator"></span>
                <span class="status-text">RAG API: Checking...</span>
            </span>
            <span id="message-count" class="message-count">0 messages</span>
        </div>
    </div>
</div>

<script>
(function() {
    // Socket.IO connection for chat
    const chatSocket = io('/chat');
    
    // Elements
    const messagesContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('btn-send');
    const typingIndicator = document.getElementById('typing-indicator');
    const connectionStatus = document.getElementById('chat-connection-status');
    const ragApiStatus = document.getElementById('rag-api-status');
    const messageCountEl = document.getElementById('message-count');
    
    let messageCount = 0;
    let userScrolled = false;
    
    // Socket.IO events
    chatSocket.on('connect', () => {
        console.log('Connected to Chat widget');
        connectionStatus.innerHTML = '<span class="status-dot online"></span>';
        checkRagApiStatus();
    });
    
    chatSocket.on('disconnect', () => {
        console.log('Disconnected from Chat widget');
        connectionStatus.innerHTML = '<span class="status-dot offline"></span>';
        ragApiStatus.querySelector('.status-text').textContent = 'RAG API: Disconnected';
    });
    
    chatSocket.on('history', (messages) => {
        // Clear welcome message if there's history
        if (messages.length > 0) {
            messagesContainer.innerHTML = '';
            messages.forEach(msg => addMessageToUI(msg));
            scrollToBottom();
        }
        messageCount = messages.length;
        updateMessageCount();
    });
    
    chatSocket.on('new_message', (message) => {
        addMessageToUI(message);
        scrollToBottom();
        messageCount++;
        updateMessageCount();
        hideTyping();
    });
    
    chatSocket.on('error', (error) => {
        addErrorMessage(error.message || 'An error occurred');
        hideTyping();
    });
    
    chatSocket.on('history_cleared', () => {
        messagesContainer.innerHTML = `
            <div class="chat-welcome">
                <p>👋 Chat cleared. Start a new conversation!</p>
            </div>
        `;
        messageCount = 0;
        updateMessageCount();
    });
    
    // Send message
    function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        
        // Clear input
        chatInput.value = '';
        chatInput.style.height = 'auto';
        
        // Show typing indicator
        showTyping();
        
        // Send via WebSocket
        chatSocket.emit('send_message', { message: message });
    }
    
    // Add message to UI
    function addMessageToUI(message) {
        // Remove welcome message if present
        const welcome = messagesContainer.querySelector('.chat-welcome');
        if (welcome) welcome.remove();
        
        const messageEl = document.createElement('div');
        messageEl.className = `chat-message ${message.role}`;
        
        const timestamp = new Date(message.timestamp).toLocaleTimeString('de-DE');
        
        messageEl.innerHTML = `
            <div class="message-header">
                <span class="message-role">${message.role === 'user' ? '👤 You' : '🤖 Assistant'}</span>
                <span class="message-time">${timestamp}</span>
            </div>
            <div class="message-content">${renderMarkdown(message.content)}</div>
            ${message.metadata && message.metadata.sources ? `
                <div class="message-sources">
                    <small>📚 Sources: ${message.metadata.sources.length}</small>
                </div>
            ` : ''}
        `;
        
        messagesContainer.appendChild(messageEl);
    }
    
    // Add error message
    function addErrorMessage(error) {
        const errorEl = document.createElement('div');
        errorEl.className = 'chat-message error';
        errorEl.innerHTML = `
            <div class="message-content">⚠️ ${escapeHtml(error)}</div>
        `;
        messagesContainer.appendChild(errorEl);
        scrollToBottom();
    }
    
    // Show/hide typing indicator
    function showTyping() {
        typingIndicator.classList.remove('hidden');
        scrollToBottom();
    }
    
    function hideTyping() {
        typingIndicator.classList.add('hidden');
    }
    
    // Auto-scroll lock: don't auto-scroll if user scrolled up
    messagesContainer.addEventListener('scroll', () => {
        const atBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 80;
        userScrolled = !atBottom;
    });
    
    // Scroll to bottom
    function scrollToBottom() {
        if (!userScrolled) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    // Update message count
    function updateMessageCount() {
        messageCountEl.textContent = `${messageCount} message${messageCount !== 1 ? 's' : ''}`;
    }
    
    // Check RAG API status
    function checkRagApiStatus() {
        fetch('/widget/chat/api/rag-status')
            .then(res => res.json())
            .then(data => {
                const statusEl = ragApiStatus.querySelector('.status-indicator');
                const textEl = ragApiStatus.querySelector('.status-text');
                
                if (data.status === 'online') {
                    statusEl.className = 'status-indicator online';
                    textEl.textContent = `RAG API: Online (${Math.round(data.response_time)}ms)`;
                } else {
                    statusEl.className = 'status-indicator offline';
                    textEl.textContent = 'RAG API: Offline';
                }
            })
            .catch(() => {
                const statusEl = ragApiStatus.querySelector('.status-indicator');
                const textEl = ragApiStatus.querySelector('.status-text');
                statusEl.className = 'status-indicator offline';
                textEl.textContent = 'RAG API: Error';
            });
    }
    
    // Escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Simple Markdown rendering: bold, italic, inline code
    function renderMarkdown(text) {
        return escapeHtml(text)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
    }
    
    // Event listeners
    sendButton.addEventListener('click', sendMessage);
    
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Auto-resize textarea
    chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });
    
    // Clear chat button
    document.getElementById('btn-clear-chat').addEventListener('click', () => {
        if (confirm('Clear all chat history?')) {
            chatSocket.emit('clear_history');
        }
    });
    
    // Quick reply buttons
    document.querySelectorAll('.quick-reply-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            chatInput.value = btn.dataset.msg;
            sendMessage();
        });
    });
    
    // Show quick replies when input is focused
    chatInput.addEventListener('focus', () => {
        document.getElementById('quick-replies').classList.remove('hidden');
    });
    
    // Request initial history
    chatSocket.emit('request_history', { limit: 20 });
})();
</script>
