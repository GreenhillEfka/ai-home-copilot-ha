<!-- Sensor Overview Widget Template - Live Sensor Data -->
<div class="widget sensor-overview-widget" id="widget-sensor-overview">
    <div class="widget-header">
        <h3>📡 Sensor Overview</h3>
        <div class="widget-controls">
            <select id="sensor-filter" class="sensor-filter">
                <option value="all">All Sensors</option>
                <option value="temperature">🌡️ Temperature</option>
                <option value="humidity">💧 Humidity</option>
                <option value="air_quality">🌬️ Air Quality</option>
                <option value="motion">🚶 Motion</option>
                <option value="light">💡 Light</option>
            </select>
            <button class="btn-icon" id="btn-refresh-sensors" title="Refresh">🔄</button>
        </div>
    </div>
    
    <div class="widget-content">
        <!-- Sensor Grid -->
        <div id="sensor-grid" class="sensor-grid">
            <!-- Sensors will be populated dynamically -->
        </div>
        
        <!-- Sensor Detail Modal -->
        <div id="sensor-detail-modal" class="sensor-modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 id="modal-sensor-title">Sensor Details</h4>
                    <button class="btn-close" id="btn-close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="sensor-detail-chart">
                        <canvas id="sensor-chart"></canvas>
                    </div>
                    <div class="sensor-detail-info">
                        <div class="info-row">
                            <span class="info-label">Location:</span>
                            <span class="info-value" id="detail-location">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Value:</span>
                            <span class="info-value" id="detail-value">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Status:</span>
                            <span class="info-value" id="detail-status">--</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Range:</span>
                            <span class="info-value" id="detail-range">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="widget-footer">
        <small>Last update: <span id="sensor-timestamp">--:--:--</span> • 
               <span id="sensor-count">0</span> sensors monitored</small>
    </div>
</div>

<!-- Load Chart.js for graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
(function() {
    // Socket.IO connection for sensor overview
    const sensorSocket = io('/sensor_overview');
    
    // State
    let currentFilter = 'all';
    let sensorChart = null;
    let allSensorData = {};
    
    // Elements
    const sensorGrid = document.getElementById('sensor-grid');
    const sensorFilter = document.getElementById('sensor-filter');
    const timestampEl = document.getElementById('sensor-timestamp');
    const sensorCountEl = document.getElementById('sensor-count');
    const modal = document.getElementById('sensor-detail-modal');
    
    // Status color mapping
    const statusColors = {
        'comfortable': '#28a745',
        'optimal': '#28a745',
        'good': '#28a745',
        'normal': '#28a745',
        'cold': '#17a2b8',
        'dry': '#17a2b8',
        'moderate': '#ffc107',
        'low': '#ffc107',
        'high': '#fd7e14',
        'hot': '#dc3545',
        'humid': '#dc3545',
        'unhealthy_sensitive': '#fd7e14',
        'unhealthy': '#dc3545',
        'active': '#28a745',
        'idle': '#6c757d',
        'unknown': '#6c757d'
    };
    
    // Status icons
    const statusIcons = {
        'comfortable': '😊',
        'optimal': '😊',
        'good': '😊',
        'normal': '✓',
        'cold': '🥶',
        'dry': '💨',
        'moderate': '⚠️',
        'low': '↓',
        'high': '↑',
        'hot': '🥵',
        'humid': '💦',
        'unhealthy_sensitive': '😷',
        'unhealthy': '😷',
        'active': '🚶',
        'idle': '💤',
        'unknown': '❓'
    };
    
    // Socket.IO events
    sensorSocket.on('connect', () => {
        console.log('Connected to Sensor Overview widget');
    });
    
    sensorSocket.on('disconnect', () => {
        console.log('Disconnected from Sensor Overview widget');
    });
    
    sensorSocket.on('sensor_data', (data) => {
        allSensorData = data.sensors;
        renderSensors(data.sensors);
        updateTimestamp(data.timestamp);
        sensorCountEl.textContent = data.count;
    });
    
    // Render sensors
    function renderSensors(sensors) {
        sensorGrid.innerHTML = '';
        
        for (const [type, locations] of Object.entries(sensors)) {
            if (currentFilter !== 'all' && type !== currentFilter) continue;
            
            for (const [location, data] of Object.entries(locations)) {
                const card = createSensorCard(type, location, data);
                sensorGrid.appendChild(card);
            }
        }
        
        // Add click handlers
        document.querySelectorAll('.sensor-card').forEach(card => {
            card.addEventListener('click', () => {
                showSensorDetail(
                    card.dataset.type,
                    card.dataset.location,
                    card.dataset
                );
            });
        });
    }
    
    // Create sensor card
    function createSensorCard(type, location, data) {
        const card = document.createElement('div');
        card.className = `sensor-card ${data.status}`;
        card.dataset.type = type;
        card.dataset.location = location;
        card.dataset.name = data.name;
        card.dataset.value = data.value;
        card.dataset.unit = data.unit;
        card.dataset.status = data.status;
        
        const statusColor = statusColors[data.status] || '#6c757d';
        const statusIcon = statusIcons[data.status] || '•';
        
        card.innerHTML = `
            <div class="sensor-card-header">
                <span class="sensor-type">${getSensorTypeIcon(type)} ${type.replace('_', ' ')}</span>
                <span class="sensor-status" style="color: ${statusColor}">
                    ${statusIcon} ${data.status}
                </span>
            </div>
            <div class="sensor-card-body">
                <div class="sensor-name">${data.name}</div>
                <div class="sensor-value">${data.value !== null ? data.value : '--'}${data.unit}</div>
                <div class="sensor-range">
                    <span>Min: ${data.min}${data.unit}</span>
                    <span>Max: ${data.max}${data.unit}</span>
                </div>
            </div>
            <div class="sensor-card-indicator" style="background: ${statusColor}"></div>
        `;
        
        return card;
    }
    
    // Get sensor type icon
    function getSensorTypeIcon(type) {
        const icons = {
            'temperature': '🌡️',
            'humidity': '💧',
            'air_quality': '🌬️',
            'motion': '🚶',
            'light': '💡'
        };
        return icons[type] || '📊';
    }
    
    // Update timestamp
    function updateTimestamp(isoString) {
        const date = new Date(isoString);
        timestampEl.textContent = date.toLocaleTimeString('de-DE');
    }
    
    // Show sensor detail modal
    function showSensorDetail(type, location, data) {
        document.getElementById('modal-sensor-title').textContent = 
            `${getSensorTypeIcon(type)} ${data.name}`;
        document.getElementById('detail-location').textContent = location;
        document.getElementById('detail-value').textContent = 
            `${data.value} ${data.unit}`;
        document.getElementById('detail-status').textContent = data.status;
        document.getElementById('detail-range').textContent = 
            `${data.min} - ${data.max} ${data.unit}`;
        
        // Generate mock chart data
        generateMockChartData(type, data.value, data.unit);
        
        modal.classList.remove('hidden');
    }
    
    // Generate mock chart data
    function generateMockChartData(type, currentValue, unit) {
        const ctx = document.getElementById('sensor-chart').getContext('2d');
        
        // Generate 10 data points
        const labels = [];
        const dataPoints = [];
        const now = new Date();
        
        for (let i = 9; i >= 0; i--) {
            const time = new Date(now.getTime() - i * 60000);
            labels.push(time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
            
            // Generate realistic variation
            const variation = (Math.random() - 0.5) * 10;
            dataPoints.push(Math.max(0, currentValue + variation).toFixed(1));
        }
        
        // Destroy existing chart
        if (sensorChart) {
            sensorChart.destroy();
        }
        
        // Create new chart
        sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: `Value (${unit})`,
                    data: dataPoints,
                    borderColor: '#4A90D9',
                    backgroundColor: 'rgba(74, 144, 217, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3,
                    pointHoverRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: {
                            color: 'rgba(0,0,0,0.1)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }
    
    // Close modal
    function closeModal() {
        modal.classList.add('hidden');
    }
    
    // Event listeners
    sensorFilter.addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderSensors(allSensorData);
    });
    
    document.getElementById('btn-refresh-sensors').addEventListener('click', () => {
        sensorSocket.emit('request_sensors');
    });
    
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });
    
    // Request initial data
    sensorSocket.emit('request_sensors');
})();
</script>

<style>

}

}

    font-weight: 600;
    text-transform: capitalize;
}

    margin-bottom: 10px;
}

}

    color: var(--text-primary, #333);
}

    display: flex;
    justify-content: space-between;

    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

    display: none;
}

.modal-content {
    background: var(--card-bg, #fff);

    padding: 20px;

    display: flex;
    justify-content: space-between;

</style>
