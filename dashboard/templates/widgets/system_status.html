<!-- System Status Widget Template -->
<div class="widget system-status-widget" id="widget-system-status">
    <div class="widget-header">
        <h3>🖥️ System Status</h3>
        <span class="widget-status" id="system-status-indicator">
            <span class="status-dot online"></span>
            <span>Live</span>
        </span>
    </div>
    
    <div class="widget-content">
        <!-- CPU Card -->
        <div class="metric-card">
            <div class="metric-header">
                <span class="metric-icon">⚡</span>
                <span class="metric-title">CPU</span>
            </div>
            <div class="metric-value" id="cpu-value">--%</div>
            <div class="metric-detail" id="cpu-cores">-- cores</div>
            <div class="progress-bar">
                <div class="progress-fill" id="cpu-progress" style="width: 0%"></div>
            </div>
        </div>
        
        <!-- Memory Card -->
        <div class="metric-card">
            <div class="metric-header">
                <span class="metric-icon">🧠</span>
                <span class="metric-title">Memory</span>
            </div>
            <div class="metric-value" id="memory-value">--%</div>
            <div class="metric-detail" id="memory-detail">-- / -- GB</div>
            <div class="progress-bar">
                <div class="progress-fill" id="memory-progress" style="width: 0%"></div>
            </div>
        </div>
        
        <!-- Disk Card -->
        <div class="metric-card">
            <div class="metric-header">
                <span class="metric-icon">💾</span>
                <span class="metric-title">Disk</span>
            </div>
            <div class="metric-value" id="disk-value">--%</div>
            <div class="metric-detail" id="disk-detail">-- / -- GB</div>
            <div class="progress-bar">
                <div class="progress-fill" id="disk-progress" style="width: 0%"></div>
            </div>
        </div>
        
        <!-- Uptime Card -->
        <div class="metric-card">
            <div class="metric-header">
                <span class="metric-icon">⏱️</span>
                <span class="metric-title">Uptime</span>
            </div>
            <div class="metric-value" id="uptime-value">--</div>
            <div class="metric-detail" id="uptime-detail">System running</div>
        </div>
    </div>
    
    <div class="widget-footer">
        <small>Last update: <span id="system-status-timestamp">--:--:--</span></small>
    </div>
</div>

<script>
(function() {
    // Socket.IO connection for system status
    const systemSocket = io('/system_status');
    
    systemSocket.on('connect', () => {
        console.log('Connected to System Status widget');
        document.getElementById('system-status-indicator').innerHTML = 
            '<span class="status-dot online"></span><span>Live</span>';
    });
    
    systemSocket.on('disconnect', () => {
        console.log('Disconnected from System Status widget');
        document.getElementById('system-status-indicator').innerHTML = 
            '<span class="status-dot offline"></span><span>Offline</span>';
    });
    
    systemSocket.on('metrics', (data) => {
        updateSystemMetrics(data);
    });
    
    function updateSystemMetrics(data) {
        // CPU
        const cpuPercent = data.cpu.percent;
        document.getElementById('cpu-value').textContent = cpuPercent + '%';
        document.getElementById('cpu-cores').textContent = 
            `${data.cpu.physical_cores || data.cpu.cores} physical / ${data.cpu.cores} logical cores`;
        document.getElementById('cpu-progress').style.width = cpuPercent + '%';
        
        // Memory
        const memPercent = data.memory.percent;
        document.getElementById('memory-value').textContent = memPercent + '%';
        const usedGB = (data.memory.used / (1024 * 1024 * 1024)).toFixed(1);
        const totalGB = (data.memory.total / (1024 * 1024 * 1024)).toFixed(1);
        document.getElementById('memory-detail').textContent = `${usedGB} / ${totalGB} GB`;
        document.getElementById('memory-progress').style.width = memPercent + '%';
        
        // Disk
        const diskPercent = data.disk.percent;
        document.getElementById('disk-value').textContent = diskPercent + '%';
        const usedDiskGB = (data.disk.used / (1024 * 1024 * 1024)).toFixed(1);
        const totalDiskGB = (data.disk.total / (1024 * 1024 * 1024)).toFixed(1);
        document.getElementById('disk-detail').textContent = `${usedDiskGB} / ${totalDiskGB} GB`;
        document.getElementById('disk-progress').style.width = diskPercent + '%';
        
        // Uptime
        document.getElementById('uptime-value').textContent = data.uptime.formatted;
        
        // Timestamp
        const now = new Date(data.timestamp);
        document.getElementById('system-status-timestamp').textContent = 
            now.toLocaleTimeString('de-DE');
    }
    
    // Request initial data
    systemSocket.emit('request_metrics');
})();
</script>

}
