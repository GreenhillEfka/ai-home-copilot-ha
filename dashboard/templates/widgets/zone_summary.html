<!-- Zone Summary Widget Template - Live Zone Monitoring with Material Design Cards -->
<div class="widget zone-summary-widget" id="widget-zone-summary">
    <div class="widget-header">
        <h3>🏠 Zone Summary</h3>
        <div class="widget-controls">
            <select id="zone-filter" class="zone-filter">
                <option value="all">Alle Zonen</option>
                <option value="indoor">Innenbereich</option>
                <option value="outdoor">Außenbereich</option>
            </select>
            <button class="btn-icon" id="btn-refresh-zones" title="Aktualisieren">🔄</button>
        </div>
    </div>
    
    <div class="widget-content">
        <!-- Zone Cards Grid -->
        <div id="zone-cards-container" class="zone-cards-grid">
            <!-- Zone cards will be populated dynamically by zone_cards.js -->
            <div class="loading-placeholder">
                <span class="mdi mdi-loading mdi-spin"></span>
                <span>Lade Zonen...</span>
            </div>
        </div>
    </div>
    
    <div class="widget-footer">
        <small>
            Letzte Aktualisierung: <span id="zone-timestamp">--:--:--</span> • 
            <span id="zone-count">0</span> Zonen überwacht •
            <span class="connection-status">
                <span class="status-dot offline"></span>
                <span id="connection-text">Verbinde...</span>
            </span>
        </small>
    </div>
</div>

<style>
/* Zone Summary Widget Styles */
.zone-summary-widget {
    background: var(--bg-secondary);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--border-color);
}

.zone-filter {
    padding: 8px 12px;
    border: 2px solid var(--border-color);
    border-radius: 6px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 0.9rem;
    cursor: pointer;
}

.zone-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 15px;
    max-height: 800px;
    overflow-y: auto;
    padding: 5px;
}

/* Zone Card - Material Design */
.zone-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.zone-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    border-color: var(--primary-color);
}

.zone-card.has-alerts {
    border-left: 4px solid var(--danger-color);
}

.zone-card.ok {
    border-left: 4px solid var(--success-color);
}

/* Zone Card Header */
.zone-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
}

.zone-card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: var(--primary-color);
}

.zone-card-title {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.zone-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0;
}

.zone-status {
    font-size: 0.75rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 12px;
    display: inline-block;
    width: fit-content;
}

.zone-status.ok {
    background: var(--success-color);
    color: #fff;
}

.zone-status.has-alerts {
    background: var(--danger-color);
    color: #fff;
}

.zone-card-alerts {
    position: relative;
}

.alert-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    animation: pulse 2s infinite;
}

.alert-badge.warning {
    background: var(--warning-color);
    color: #fff;
}

.alert-badge.danger {
    background: var(--danger-color);
    color: #fff;
}

.alert-badge.info {
    background: var(--primary-color);
    color: #fff;
}

.alert-count {
    background: rgba(255, 255, 255, 0.3);
    padding: 2px 6px;
    border-radius: 10px;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.7;
    }
}

/* Zone Card Metrics */
.zone-card-metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

.metric-item {
    background: var(--bg-tertiary);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    transition: all 0.2s;
}

.metric-item:hover {
    background: var(--bg-secondary);
    transform: scale(1.02);
}

.metric-item.warning {
    border: 2px solid var(--warning-color);
}

.metric-item.danger {
    border: 2px solid var(--danger-color);
}

.metric-item.ok {
    border: 2px solid var(--success-color);
}

.metric-icon {
    font-size: 1.25rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

.metric-value {
    display: flex;
    align-items: baseline;
    gap: 2px;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color);
}

.metric-value .unit {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
}

.metric-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 4px;
}

.metric-detail {
    font-size: 0.7rem;
    color: var(--text-secondary);
    margin-top: 2px;
}

.metric-alert {
    position: absolute;
    top: 4px;
    right: 4px;
    color: var(--danger-color);
    font-size: 0.9rem;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.3;
    }
}

/* Light Status Colors */
.metric-item.light-status.on {
    background: linear-gradient(135deg, var(--bg-tertiary) 0%, rgba(255, 193, 7, 0.1) 100%);
}

.metric-item.light-status.on .metric-icon {
    color: var(--warning-color);
}

/* Motion Status Colors */
.metric-item.motion-status.active {
    background: linear-gradient(135deg, var(--bg-tertiary) 0%, rgba(40, 167, 69, 0.1) 100%);
}

.metric-item.motion-status.active .metric-icon {
    color: var(--success-color);
}

/* Zone Card Chart */
.zone-card-chart {
    background: var(--bg-tertiary);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
}

.chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.chart-title {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
}

.chart-toggle {
    display: flex;
    gap: 4px;
}

.chart-btn {
    background: var(--bg-secondary);
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--text-secondary);
    transition: all 0.2s;
}

.chart-btn:hover {
    background: var(--primary-color);
    color: var(--text-primary);
}

.chart-btn.active {
    background: var(--primary-color);
    color: var(--text-primary);
}

.chart-container {
    position: relative;
}

.sparkline {
    display: block;
}

/* Zone Card Actions */
.zone-card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-btn {
    flex: 1;
    min-width: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.action-btn:hover {
    background: var(--primary-color);
    color: var(--text-primary);
    border-color: var(--primary-color);
    transform: translateY(-2px);
}

.action-btn .mdi {
    font-size: 1.25rem;
}

.action-btn.action-success {
    background: var(--success-color);
    color: #fff;
    border-color: var(--success-color);
}

/* Alert Details (shown on hover) */
.zone-card-alert-details {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
}

.zone-card:hover .zone-card-alert-details {
    display: block;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.alert-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-radius: 6px;
    font-size: 0.875rem;
    margin-bottom: 4px;
}

.alert-item.warning {
    background: rgba(245, 158, 11, 0.1);
    border-left: 3px solid var(--warning-color);
    color: var(--warning-color);
}

.alert-item.danger {
    background: rgba(239, 68, 68, 0.1);
    border-left: 3px solid var(--danger-color);
    color: var(--danger-color);
}

.alert-item.info {
    background: rgba(37, 99, 235, 0.1);
    border-left: 3px solid var(--primary-color);
    color: var(--primary-color);
}

.alert-item .mdi {
    font-size: 1rem;
}

/* Loading Placeholder */
.loading-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px;
    color: var(--text-secondary);
    gap: 12px;
}

.loading-placeholder .mdi-loading {
    font-size: 2rem;
}

/* Connection Status */
.connection-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--secondary-color);
}

.status-dot.online {
    background: var(--success-color);
    box-shadow: 0 0 6px var(--success-color);
}

.status-dot.offline {
    background: var(--danger-color);
}

/* Responsive Adjustments */
@media (max-width: 768px) {
    .zone-cards-grid {
        grid-template-columns: 1fr;
    }
    
    .zone-card-metrics {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .zone-card-actions {
        flex-direction: column;
    }
    
    .action-btn {
        flex-direction: row;
        justify-content: center;
    }
}
</style>

<script>
// Zone Summary Widget Initialization
// This script initializes the ZoneCardsManager when the widget is loaded

(function() {
    console.log('[Zone Summary Widget] Initializing...');
    
    // Wait for DOM and zone_cards.js to be ready
    const initZoneCards = () => {
        if (typeof ZoneCardsManager !== 'undefined') {
            console.log('[Zone Summary Widget] ZoneCardsManager available');
            
            // Initialize zone cards manager
            window.zoneCardsManager = new ZoneCardsManager({
                containerSelector: '#zone-cards-container',
                updateInterval: 5000
            });
            
            // Update connection status
            if (window.zoneCardsManager.socket) {
                window.zoneCardsManager.socket.on('connect', () => {
                    document.querySelector('.status-dot').classList.remove('offline');
                    document.querySelector('.status-dot').classList.add('online');
                    document.getElementById('connection-text').textContent = 'Verbunden';
                });
                
                window.zoneCardsManager.socket.on('disconnect', () => {
                    document.querySelector('.status-dot').classList.remove('online');
                    document.querySelector('.status-dot').classList.add('offline');
                    document.getElementById('connection-text').textContent = 'Getrennt';
                });
            }
            
            // Update timestamp on zone data
            const originalHandleZoneData = window.zoneCardsManager.handleZoneData;
            window.zoneCardsManager.handleZoneData = function(data) {
                originalHandleZoneData.call(this, data);
                
                // Update timestamp
                if (data.timestamp) {
                    const date = new Date(data.timestamp);
                    document.getElementById('zone-timestamp').textContent = 
                        date.toLocaleTimeString('de-DE');
                }
                
                // Update zone count
                document.getElementById('zone-count').textContent = data.count || 0;
            };
            
        } else {
            console.log('[Zone Summary Widget] Waiting for ZoneCardsManager...');
            setTimeout(initZoneCards, 500);
        }
    };
    
    // Start initialization
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initZoneCards);
    } else {
        initZoneCards();
    }
    
    // Zone filter
    document.getElementById('zone-filter')?.addEventListener('change', (e) => {
        const filter = e.target.value;
        const cards = document.querySelectorAll('.zone-card');
        
        cards.forEach(card => {
            if (filter === 'all') {
                card.style.display = 'block';
            } else if (filter === 'indoor') {
                const zoneId = card.dataset.zoneId;
                if (zoneId !== 'outdoor') {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            } else if (filter === 'outdoor') {
                const zoneId = card.dataset.zoneId;
                if (zoneId === 'outdoor') {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            }
        });
    });
    
    // Refresh button
    document.getElementById('btn-refresh-zones')?.addEventListener('click', () => {
        if (window.zoneCardsManager && window.zoneCardsManager.socket) {
            window.zoneCardsManager.socket.emit('request_zones');
        }
    });
})();
</script>
