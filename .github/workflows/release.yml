name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 15.0.9)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must match X.Y.Z format"
            exit 1
          fi

      - name: Verify HACS repository shape
        run: |
          count=$(find custom_components -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "ERROR: HACS repo must expose exactly one integration under custom_components/, found $count"
            find custom_components -mindepth 1 -maxdepth 1 -type d
            exit 1
          fi
          test -d custom_components/copilot_ha

      - name: Bump published versions
        run: |
          VERSION="${{ github.event.inputs.version }}"
          printf '%s\n' "$VERSION" > VERSION
          printf '%s\n' "$VERSION" > custom_components/copilot_ha/VERSION
          python3 - <<PY
import json
from pathlib import Path
manifest = Path('custom_components/copilot_ha/manifest.json')
data = json.loads(manifest.read_text())
data['version'] = '$VERSION'
manifest.write_text(json.dumps(data, indent=2) + '\n')
print(f"copilot_ha manifest -> $VERSION")
PY

      - name: Verify published version consistency
        run: |
          VERSION="${{ github.event.inputs.version }}"
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat custom_components/copilot_ha/VERSION)" = "$VERSION"
          python3 - <<PY
import json
from pathlib import Path
version = json.loads(Path('custom_components/copilot_ha/manifest.json').read_text())['version']
assert version == '$VERSION', f"manifest version is {version}, expected $VERSION"
print(f"All published versions verified: $VERSION")
PY

      - name: Commit version bump
        run: |
          git config --global user.email "pilotclaw@pilotsuite.dev"
          git config --global user.name "PilotClaw"
          git add -A
          git commit -m "chore: release v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "PilotSuite HA v${{ github.event.inputs.version }}" \
            --notes "Release v${{ github.event.inputs.version }}" \
            --clobber
