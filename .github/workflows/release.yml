name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 20.0.5"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must be X.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Bump canonical version files
        run: |
          echo "$VERSION" > VERSION
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          readme = Path("README.md")
          readme.write_text(re.sub(r"(?m)^\*\*Version:\*\*\s+.*$", f"**Version:** {version}  ", readme.read_text(), count=1))

          for path_str in ["manifest.json", "custom_components/pilotsuite/manifest.json"]:
              path = Path(path_str)
              data = json.loads(path.read_text())
              data["version"] = version
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Verify canonical version truth
        run: |
          test "$(cat VERSION)" = "$VERSION"
          grep -q "^\*\*Version:\*\* $VERSION" README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          for path_str in ['manifest.json', 'custom_components/pilotsuite/manifest.json']:
              data = json.loads(Path(path_str).read_text())
              assert data['version'] == version, (path_str, data['version'], version)
          print('Canonical version files aligned')
          PY

      - name: Commit, tag, and push
        run: |
          git config user.email "pilotclaw@pilotsuite.dev"
          git config user.name "PilotClaw"
          git add README.md VERSION manifest.json custom_components/pilotsuite/manifest.json
          git commit -m "chore(ha): release v$VERSION"
          git tag "$TAG"
          git push origin main --tags

      - name: Build HACS ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path('dist-hacs')
          if root.exists():
              shutil.rmtree(root)
          (root / 'custom_components').mkdir(parents=True)
          shutil.copytree('custom_components/pilotsuite', root / 'custom_components' / 'pilotsuite', ignore=shutil.ignore_patterns('__pycache__', '*.pyc', '*.pyo'))
          shutil.copy2('hacs.json', root / 'hacs.json')
          shutil.copy2('README.md', root / 'README.md')
          shutil.copy2('VERSION', root / 'VERSION')
          with zipfile.ZipFile('pilotsuite-styx-ha.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.relative_to(root))
          shutil.copy2('pilotsuite-styx-ha.zip', f"{Path('VERSION').read_text().strip()}.zip")
          PY

      - name: Verify ZIP before upload
        run: |
          unzip -l pilotsuite-styx-ha.zip | grep 'custom_components/pilotsuite/manifest.json'
          unzip -l pilotsuite-styx-ha.zip | grep 'hacs.json'
          unzip -p pilotsuite-styx-ha.zip custom_components/pilotsuite/manifest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" | grep "^$VERSION$"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "PilotSuite HA $TAG" \
            --notes "Release $TAG" \
            --clobber

      - name: Upload ZIP assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" pilotsuite-styx-ha.zip --clobber
          gh release upload "$TAG" "$VERSION.zip" --clobber
