name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 15.0.9)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must match X.Y.Z format"
            exit 1
          fi

      - name: Bump manifest versions
        run: |
          VERSION="${{ github.event.inputs.version }}"
          for manifest in custom_components/*/manifest.json; do
            component=$(basename "$(dirname "$manifest")")
            python3 -c "
import json
with open('$manifest', 'r+') as f:
    data = json.load(f)
    old = data.get('version', '?')
    data['version'] = '$VERSION'
    f.seek(0)
    json.dump(data, f, indent=2)
    f.truncate()
print(f'{old} → $VERSION: {component}')
"
          done

      - name: Verify manifest consistency
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MISMATCH=0
          for manifest in custom_components/*/manifest.json; do
            V=$(python3 -c "import json; print(json.load(open('$manifest'))['version'])")
            if [ "$V" != "$VERSION" ]; then
              echo "ERROR: $manifest version is $V, expected $VERSION"
              MISMATCH=1
            fi
          done
          if [ $MISMATCH -eq 1 ]; then exit 1; fi
          echo "All manifests verified: $VERSION"

      - name: Commit version bump
        run: |
          git config --global user.email "pilotclaw@pilotsuite.dev"
          git config --global user.name "PilotClaw"
          git add -A
          git commit -m "chore: bump manifests to v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "PilotSuite HA v${{ github.event.inputs.version }}" \
            --notes "Release v${{ github.event.inputs.version }}" \
            --clobber

      - name: Build and upload ZIP asset
        run: |
          git archive --format=zip --prefix=pilotsuite-styx-ha/ -o "v${{ github.event.inputs.version }}.zip" HEAD
          gh release upload "${{ github.event.inputs.version }}" "v${{ github.event.inputs.version }}.zip" --clobber

      - name: Verify ZIP contents
        run: |
          unzip -p "v${{ github.event.inputs.version }}.zip" pilotsuite-styx-ha/custom_components/copilot_ha/manifest.json | python3 -c "import json,sys; v=json.load(sys.stdin)['version']; print(f'copilot_ha: {v}')"
          unzip -p "v${{ github.event.inputs.version }}.zip" pilotsuite-styx-ha/custom_components/pilotsuite_core/manifest.json | python3 -c "import json,sys; v=json.load(sys.stdin)['version']; print(f'pilotsuite_core: {v}')"
