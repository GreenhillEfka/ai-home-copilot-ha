name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 15.0.12)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version must be X.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Bump version files
        run: |
          echo "$VERSION" > VERSION
          echo "$VERSION" > custom_components/copilot_ha/VERSION
          python3 - <<PY
import json
from pathlib import Path
m = Path('custom_components/copilot_ha/manifest.json')
d = json.loads(m.read_text())
d['version'] = '$VERSION'
m.write_text(json.dumps(d, indent=2) + '\n')
print(f"copilot_ha: {d['version']}")
PY

      - name: Verify consistency
        run: |
          if [ "$(cat VERSION)" != "$VERSION" ]; then echo "VERSION file mismatch"; exit 1; fi
          if [ "$(cat custom_components/copilot_ha/VERSION)" != "$VERSION" ]; then echo "HA VERSION mismatch"; exit 1; fi
          V=$(python3 -c "import json; print(json.loads(open('custom_components/copilot_ha/manifest.json').read())['version'])")
          if [ "$V" != "$VERSION" ]; then echo "manifest mismatch: $V"; exit 1; fi
          echo "All versions consistent: $VERSION"

      - name: Commit + Tag + Push
        run: |
          git config user.email "pilotclaw@pilotsuite.dev"
          git config user.name "PilotClaw"
          git add -A
          git commit -m "chore: release v$VERSION"
          git tag "$TAG"
          git push origin main --tags

      - name: Build ZIP
        run: |
          git archive --format=zip --prefix=pilotsuite-styx-ha/ -o "v${VERSION}.zip" HEAD
          echo "ZIP size: $(wc -c < v${VERSION}.zip) bytes"

      - name: Verify ZIP before upload
        run: |
          V=$(unzip -p "v${VERSION}.zip" pilotsuite-styx-ha/custom_components/copilot_ha/manifest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          if [ "$V" != "$VERSION" ]; then
            echo "FATAL: ZIP contains version $V, expected $VERSION"
            exit 1
          fi
          echo "ZIP verified: $V"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "PilotSuite HA $TAG" \
            --notes "Release $TAG" \
            --clobber

      - name: Upload ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "v${VERSION}.zip" --clobber

      - name: Final verification
        run: |
          sleep 3
          ASSET_URL=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.assets[] | select(.name=="v'"${VERSION}"'.zip") | .browser_download_url')
          if [ -z "$ASSET_URL" ]; then
            echo "FATAL: ZIP not found on release"
            exit 1
          fi
          echo "SUCCESS: $ASSET_URL"
