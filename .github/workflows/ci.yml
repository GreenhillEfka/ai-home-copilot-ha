name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-repo-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical HACS integration
        run: |
          test -d custom_components/pilotsuite
          echo "OK: canonical pilotsuite integration present"
      - name: Verify version consistency
        run: |
          root_v=$(cat VERSION)
          manifest_v=$(python3 -c "import json; print(json.loads(open('custom_components/pilotsuite/manifest.json').read())['version'])")
          root_manifest_v=$(python3 -c "import json; print(json.loads(open('manifest.json').read())['version'])")
          test "$root_v" = "$manifest_v"
          test "$root_v" = "$root_manifest_v"
          echo "Versions aligned: $root_v"

  test:
    needs: validate-repo-shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements_test.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_agent_status_sensor_projection.py tests/test_brain_activity_sensor_projection.py tests/test_neuron_dashboard_sensors_projection.py tests/test_notification_sensor_projection.py -q
