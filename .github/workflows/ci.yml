name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-repo-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single HACS integration
        run: |
          count=$(find custom_components -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "ERROR: Expected exactly one integration under custom_components/, found $count"
            find custom_components -mindepth 1 -maxdepth 1 -type d
            exit 1
          fi
          test -d custom_components/copilot_ha
      - name: Verify version consistency
        run: |
          root_v=$(cat VERSION)
          comp_v=$(cat custom_components/copilot_ha/VERSION)
          manifest_v=$(python3 -c "import json; print(json.loads(open('custom_components/copilot_ha/manifest.json').read())['version'])")
          test "$root_v" = "$comp_v"
          test "$root_v" = "$manifest_v"
          echo "Versions aligned: $root_v"

  test:
    needs: validate-repo-shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements_test.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -q --ignore=custom_components
