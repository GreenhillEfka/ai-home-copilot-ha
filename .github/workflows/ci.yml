name: CI/CD Pipeline (pilotsuite-styx-ha)

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Lint & Validate
  # ============================================
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 — fatal errors only
        run: |
          flake8 custom_components/copilot_ha \
            --count --select=E9,F63,F7 \
            --show-source --statistics

      - name: Run flake8 — style warnings (non-blocking)
        run: |
          flake8 custom_components/copilot_ha \
            --count --exit-zero \
            --max-complexity=10 --max-line-length=127 \
            --statistics

      - name: Validate manifest.json
        run: |
          python -c "
          import json, sys
          with open('custom_components/copilot_ha/manifest.json') as f:
              m = json.load(f)
          required = ['domain', 'name', 'version', 'documentation', 'codeowners']
          missing = [k for k in required if k not in m]
          if missing:
              print(f'ERROR: Missing keys in manifest.json: {missing}')
              sys.exit(1)
          print(f'manifest.json OK — {m[\"name\"]} v{m[\"version\"]}')
          "

      - name: Validate hacs.json
        run: |
          python -c "
          import json, sys
          with open('hacs.json') as f:
              h = json.load(f)
          required = ['name']
          missing = [k for k in required if k not in h]
          if missing:
              print(f'ERROR: Missing keys in hacs.json: {missing}')
              sys.exit(1)
          print(f'hacs.json OK — {h[\"name\"]}')
          "

      - name: Check version consistency
        run: |
          python -c "
          import json, sys
          with open('custom_components/copilot_ha/manifest.json') as f:
              manifest_ver = json.load(f)['version']
          with open('VERSION') as f:
              file_ver = f.read().strip()
          with open('custom_components/copilot_ha/VERSION') as f:
              comp_ver = f.read().strip()
          errors = []
          if manifest_ver != file_ver:
              errors.append(f'VERSION ({file_ver}) != manifest.json ({manifest_ver})')
          if manifest_ver != comp_ver:
              errors.append(f'component VERSION ({comp_ver}) != manifest.json ({manifest_ver})')
          if errors:
              for e in errors: print(f'ERROR: {e}')
              sys.exit(1)
          print(f'All versions consistent: v{manifest_ver}')
          "

  # ============================================
  # HACS Validation (non-blocking for custom repos)
  # ============================================
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  # ============================================
  # Test Suite
  # ============================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-test
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock voluptuous aiohttp pyyaml

      - name: Run tests (non-blocking)
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_anomaly_detector.py \
            --ignore=tests/test_card_generator.py \
            --ignore=tests/e2e \
            -v --tb=short -q || true

  # ============================================
  # Tag Guard (on tag push)
  # Ensures CHANGELOG.md is updated in the tagged commit
  # ============================================
  tag-changelog-guard:
    name: Tag Guard — CHANGELOG.md updated
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ensure CHANGELOG.md changed in tagged commit
        run: |
          set -euo pipefail
          echo "Tagged commit: $GITHUB_SHA"
          changed_files="$(git show --name-only --pretty='format:' \"$GITHUB_SHA\")"
          echo "$changed_files"
          echo "$changed_files" | grep -qx 'CHANGELOG.md' || {
            echo "ERROR: Tag guard failed — CHANGELOG.md was not modified in the tagged commit."
            echo "Fix: update CHANGELOG.md in the release commit, then re-tag."
            exit 1
          }

  # ============================================
  # Release (on tag push)
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [tag-changelog-guard, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~5)..HEAD --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Installation via HACS
            1. HACS oeffnen
            2. Custom Repository hinzufuegen: `https://github.com/GreenhillEfka/pilotsuite-styx-ha`
            3. PilotSuite installieren
            4. Home Assistant neu starten

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
