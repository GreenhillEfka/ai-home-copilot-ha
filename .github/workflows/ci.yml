name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio voluptuous aiohttp pyyaml pydantic

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_anomaly_detector.py \
            --ignore=tests/test_card_generator.py \
            --ignore=tests/accessibility/ \
            --ignore=tests/test_config_flow_delta_write.py \
            --ignore=tests/test_habitus_zones_api.py \
            --deselect=tests/test_zone_auto_setup.py::TestAggregation::test_mixed_areas_produce_correct_zones \
            -v --tb=short -q

      - name: Syntax check
        run: |
          find custom_components/copilot_ha -name '*.py' -exec python -m py_compile {} +
