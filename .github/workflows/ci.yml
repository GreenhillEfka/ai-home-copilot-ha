name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-repo-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single HACS integration
        run: |
          # Allow up to 2 integrations: copilot_ha (legacy) + pilotsuite_styx (new)
          for dir in copilot_ha pilotsuite_styx; do
            if [ -d "custom_components/$dir" ]; then
              echo "OK: $dir integration present"
            fi
          done
          count=$(find custom_components -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" -gt "2" ]; then
            echo "ERROR: Too many integrations ($count), max 2"
            find custom_components -mindepth 1 -maxdepth 1 -type d
            exit 1
          fi
      - name: Verify version consistency
        run: |
          root_v=$(cat VERSION)
          comp_v=$(cat custom_components/copilot_ha/VERSION)
          manifest_v=$(python3 -c "import json; print(json.loads(open('custom_components/copilot_ha/manifest.json').read())['version'])")
          test "$root_v" = "$comp_v"
          test "$root_v" = "$manifest_v"
          echo "Versions aligned: $root_v"

  test:
    needs: validate-repo-shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements_test.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_agent_status_sensor_projection.py tests/test_brain_activity_sensor_projection.py tests/test_neuron_dashboard_sensors_projection.py tests/test_notification_sensor_projection.py -q
