name: Visual Guards (Playwright) (optional)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]

jobs:
  visual-guards:
    name: Visual Guards (PS-UX-053)
    runs-on: ubuntu-latest
    # Optional on PRs: only run when label is present. Always allowed via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-visual-guards')

    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '20'
      DASHBOARD_URL: 'http://127.0.0.1:8766/dashboard'
      CI: 'true'

    steps:
      - name: Checkout HA (this repo)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node deps (Playwright)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python deps (Dashboard server)
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-socketio flask-compress

      - name: Start dashboard server + readiness check
        run: |
          python dashboard/app.py &
          python - <<'PY'
          import time
          import urllib.request

          url = 'http://127.0.0.1:8766/api/status'
          for i in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as r:
                      if r.status == 200:
                          print('Dashboard ready')
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit('Dashboard not ready')
          PY

      - name: Run visual guards (subset)
        run: |
          npx playwright test \
            tests/e2e/uistate_visual.spec.ts \
            tests/e2e/partial_failure_badges_visual.spec.ts

      - name: Upload Playwright report/artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-guards
          path: |
            test-results/**
            tests/e2e/screenshots/**
          retention-days: 7
